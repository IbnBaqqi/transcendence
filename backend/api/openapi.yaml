# The OpenAPI version this document is written in - not our API's version.
# 3.1 is the JSON-Schema-aligned one; Swagger UI 5.x renders it.
openapi: 3.1.0

# Who/what this API is. Swagger UI shows this block at the top of the page.
info:
  title: Foraged goods marketplace API
  version: 0.1.0
  # "|" keeps the newlines - the description renders as Markdown in the UI.
  description: |
    A marketplace for foraged goods — berries, mushrooms, herbs. Sellers post
    listings, buyers browse, message them and place orders. Payments are
    simulated; no money changes hands.

    ## Authentication

    Two tokens, with opposite properties.

    The **access token** is a signed JWT sent on every request:

        Authorization: Bearer <access_token>

    It is verified without touching the database, which also means it cannot be
    revoked - so it is short-lived (15 minutes by default, `ACCESS_TOKEN_TTL`).

    The **refresh token** is an opaque value in an HttpOnly `refresh_token`
    cookie, set by signup and login and valid for 7 days. `POST /auth/refresh`
    exchanges it for a new access token and rotates it. Only its hash is
    stored, so a database leak cannot resume a session.

    `POST /auth/reset-password` revokes every refresh token and API key for
    that user, since a forgotten password is often a compromised one. Existing
    tabs stop working once their access token expires, so a client should treat
    the next 401 as "log in again" rather than as a bug. An access token issued
    before the reset keeps working until it expires - it cannot be revoked.

    When an access token expires, the 401 carries
    `WWW-Authenticate: Bearer error="invalid_token"` - the signal to refresh
    rather than to show a login screen. `GET /auth/me` returns the identity
    behind a token that is still valid, for restoring a session on page load.

    Public endpoints (browsing listings, search, images) work without one.

    ## Ids

    Every id is a **uuid v7**: the leading 48 bits are a millisecond timestamp,
    so ids sort chronologically and carry their own creation time. Treat them
    as opaque strings - the ordering is safe to rely on for cursors, but not
    something to parse.

    ## Errors

    Errors from the endpoints below are all the same shape:
    `{"error": "..."}`. Messages on 4xx describe what the caller did wrong
    and are written for display - sentence case, no trailing full stop. 5xx
    always returns a fixed "Something went wrong" and the detail goes to
    the server log, tagged with the `X-Request-ID` returned on every response.

    Two cases bypass that envelope, because they never reach a handler: an
    unrouted path returns a plain-text 404, and a routed path called with the
    wrong method returns an empty 405.

# The base URL every path in this file is relative to. Because /api/v1 lives
# here, paths below can be written as /listings instead of /api/v1/listings.
servers:
  - url: /api/v1
    description: Relative, so "Try it out" follows whatever host serves the docs

# Tags are just grouping labels; each operation names one and Swagger UI
# renders one collapsible section per tag.
tags:
  - name: auth
    description: Signup, login, logout
  - name: listings
    description: Browsing, searching and managing listings
  - name: images
    description: Listing photos
  - name: health
    description: Liveness and dependency checks
  - name: wishlist
    description: Saved listings
  - name: orders
    description: The simulated order lifecycle
  - name: chat
    description: Buyer/seller conversations
  - name: follows
    description: The social graph - who follows whom
  - name: blocks
    description: Who has refused contact with whom
  - name: me
    description: The authenticated user's own resources
  - name: moderation
    description: Admin-only review of reported listings

# A list here means OR: send either a bearer token or an API key. Individual
# public operations switch it off with an empty "security: []", and the
# key-management operations narrow it back to bearerAuth alone.
security:
  - bearerAuth: []
  - apiKeyAuth: []

# "components" is the reusable-definitions section. Nothing in here appears in
# the docs on its own - it only shows up where something $refs it.
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        A key from `POST /me/api-keys`, for machine clients. It acts as its
        owner - same permissions, same ownership checks - and is rate limited
        per key rather than per IP.

        Keys cannot manage keys: creating, listing and revoking need a session,
        so a leaked key cannot mint a replacement and survive its own
        revocation.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT # documentation only; no tool verifies the format
      description: |
        Access token issued by signup or login. Expired and missing tokens are
        both answered with 401.

  schemas:
    # Matches handler.errorResponse exactly: Error string `json:"error"`,
    # Details map[string]string `json:"details,omitempty"`.
    Error:
      type: object
      required: [error] # "details" is omitempty in Go, so it is not required
      properties:
        error:
          type: string
          description: |
            Safe to show a user on 4xx, and written for display: sentence case,
            no trailing full stop. Render it as-is rather than transforming it.
            On 5xx this is always "Something went wrong" — the cause is in the
            server log, tagged with the `X-Request-ID` on the response.
          examples: ["Listing not found"]
        details:
          type: object
          # "any key, string value" - the YAML spelling of map[string]string.
          additionalProperties:
            type: string
          description: Reserved for field-level validation errors; absent today.

    ListingImage:
      type: object
      required: [id, url, position]
      properties:
        id:
          type: string
          format: uuid
          examples: ["01a02305-b81c-7dcb-86a0-7f75e33e0af3"]
        url:
          type: string
          description: Path served by the API, e.g. for use in an `img` tag.
          examples: ["/uploads/0a7a0bc6-99f9-42f8-9ba0-c908a9cb3a93.png"]
        position:
          type: integer
          format: int32
          description: Display order, ascending. Unique per listing.
          examples: [0]

    Avatar:
      type: object
      required: [avatar_url]
      properties:
        avatar_url:
          type: string
          description: Path served by the API, for use in an `img` tag.
          examples: ["/uploads/0a7a0bc6-99f9-42f8-9ba0-c908a9cb3a93.png"]

    Listing:
      type: object
      # Every field without omitempty in ListingResponse is always present.
      required:
        [
          id,
          seller_id,
          title,
          description,
          category,
          price,
          quantity,
          unit,
          created_at,
          updated_at,
          images,
        ]
      properties:
        id:
          type: string
          format: uuid
          examples: ["01a02305-b81c-7dcb-86a0-7f75e33e0af3"]
        seller_id:
          type: string
          format: uuid # Go uuid.UUID marshals to a string
        title:
          type: string
          maxLength: 100
          examples: ["Golden Chanterelles"]
        description:
          type: string
          description: Empty string when the seller left it blank.
        category:
          type: string
          examples: ["mushrooms"]
        price:
          type: number
          format: double
          description: Price per unit. Stored as NUMERIC(10,2).
          examples: [18.5]
        quantity:
          type: integer
          format: int32
          description: Remaining quantity; 0 means sold out.
          examples: [4]
        unit:
          type: string
          examples: ["kg"]
        created_at:
          type: string
          format: date-time # Go time.Time marshals to RFC 3339
        updated_at:
          type: string
          format: date-time
        images:
          type: array
          description: Always present; empty when the listing has no photos.
          items:
            # $ref = "reuse that definition here". This is why schemas exist.
            $ref: "#/components/schemas/ListingImage"
        removed_at:
          type: string
          format: date-time
          description: |
            When a moderator removed this listing. **Absent** unless it was
            removed *and* you are its seller or an admin — for everyone else a
            removed listing is 404, so the field can never appear.

    PaginatedListings:
      type: object
      required: [items, total, page, limit, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        total:
          type: integer
          format: int64
          description: Matching listings across all pages.
        page:
          type: integer
          description: Echoes the requested page, even past the last one.
        limit:
          type: integer
          description: Clamped to 50.
        total_pages:
          type: integer

    CreateAPIKey:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
          description: What this key is for. Trimmed; must not be blank.
          examples: ["ci pipeline"]

    APIKey:
      type: object
      required: [id, name, key_prefix, last_used_at, revoked_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          description: The first characters of the key, to tell rows apart.
          examples: ["fk_live_a3f9"]
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: |
            Null until the key is used. Recorded at most once a minute, so it
            is a rough "last seen" rather than a request log.
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: |
                Shown once and never again. Store it now.
              examples: ["fk_live_a3f9c2..."]

    # --- auth ---------------------------------------------------------------

    SignupRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          maxLength: 50
          description: |
            Counted in characters, not bytes, and after trimming — surrounding
            whitespace is stripped and does not count toward the limit, so a
            padded 50-character name is accepted. Stored as typed; uniqueness
            ignores case, so `Forager` and `forager` are one account.
          examples: ["forager42"]
        email:
          type: string
          format: email
          maxLength: 150
          description: |
            Trimmed, stored as typed, and unique ignoring case.
          examples: ["forager@example.com"]
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: |
            Counted in bytes, not characters — bcrypt's own limit is 72 bytes,
            so a long passphrase with accented characters can be rejected at
            fewer than 72 typed characters. Hashed before storage; never
            returned.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: |
            Matched ignoring case and surrounding whitespace, so it need not be
            typed the way it was at signup. The password is matched exactly —
            spaces in it are significant.

            **Login is by email only**, deliberately. A username is a display
            name: public, shown to others, and meant to be changeable, so it is
            not a credential. Email is also the recovery channel for password
            reset and the identity OAuth links on, which keeps one identity
            rather than two doors onto the same account.

            The other planned sign-in path is OAuth (#35), not
            username/password.
        password:
          type: string
          format: password
      # The login handler uses DisallowUnknownFields, so an extra key is a 400.
      # Signup does NOT - that asymmetry is real, not a typo here.
      additionalProperties: false

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
      additionalProperties: false

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: The value from the emailed link's `?token=`.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
      additionalProperties: false

    UserInfo:
      type: object
      required: [id, username, email, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          examples: ["USER"]

    AuthResponse:
      type: object
      required: [access_token, user]
      properties:
        access_token:
          type: string
          description: |
            Send as `Authorization: Bearer <access_token>`. The refresh token
            is NOT in the body — it comes back as an HttpOnly cookie.
        user:
          $ref: "#/components/schemas/UserInfo"

    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        checks:
          type: object
          additionalProperties:
            type: string
          examples: [{ "database": "healthy" }]

    # --- listings & orders (authenticated) -----------------------------------

    ListingInput:
      type: object
      # Create and update take the identical body, so they share this schema.
      # PUT is a full replace: every field is required on both.
      required: [title, category, price, quantity, unit]
      properties:
        title:
          type: string
          maxLength: 100
          description: |
            The server counts BYTES, so accented characters use up more than
            one of the 100.
          examples: ["Golden Chanterelles"]
        description:
          type: string
          description: The only optional field.
        category:
          type: string
          maxLength: 50
          examples: ["mushrooms"]
        price:
          type: number
          format: double
          exclusiveMinimum: 0 # "price must be greater than 0"
          examples: [18.5]
        quantity:
          type: integer
          format: int32
          exclusiveMinimum: 0
          examples: [4]
        unit:
          type: string
          maxLength: 20
          examples: ["kg"]

    CreateOrderInput:
      type: object
      required: [listing_id, quantity]
      properties:
        listing_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          exclusiveMinimum: 0

    Order:
      type: object
      required:
        [
          id,
          listing_id,
          listing_title,
          buyer_id,
          seller_id,
          quantity,
          unit_price,
          total_price,
          status,
          seller_handed_over_at,
          buyer_received_at,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
        listing_title:
          type: string
          description: |
            Snapshotted when the order was placed, so the order still reads
            correctly after the listing is edited.
        buyer_id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
        unit_price:
          type: number
          format: double
          description: |
            Price per unit, snapshotted when the order was placed, so the order
            still reads correctly after the listing is repriced.

            Stored as `NUMERIC(10,2)` and converted only on the way out —
            `total_price` is multiplied by Postgres in exact decimal, never in
            Go. Trailing zeroes are not preserved: 18.50 is sent as 18.5, and
            74.00 as 74. Format for display client-side.
          examples: [18.5]
        total_price:
          type: number
          format: double
          description: unit_price × quantity, computed in the database.
          examples: [74]
        status:
          $ref: "#/components/schemas/OrderStatus"
        seller_handed_over_at:
          # "null OR a timestamp" - the Go field is *time.Time.
          type: [string, "null"]
          format: date-time
          description: Set when the seller marked handover; null until then.
        buyer_received_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderStatus:
      type: string
      description: |
        The lifecycle: `pending` → `confirmed` → `completed`, or `cancelled`
        from either of the first two.

        `completed` needs BOTH sides: the seller calls `/handover` and the
        buyer calls `/receive`. Whichever comes first only stamps its own
        timestamp and leaves the status at `confirmed`.

        An earlier schema had a `paid` status; migration 007 removed it.
      enum: [pending, confirmed, completed, cancelled]

    # --- chat & settings ------------------------------------------------------

    StartConversationInput:
      type: object
      required: [listing_id, body]
      properties:
        listing_id:
          type: string
          format: uuid
        body:
          type: string
          maxLength: 2000
          description: |
            The opening message. Trimmed of surrounding whitespace; a body
            that is empty after trimming is a 400.

    SendMessageInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 2000

    ReportListingRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [spam, prohibited, misleading, offensive, other]
        detail:
          type: string
          maxLength: 500
          description: |
            Free text, and the only place to say what `other` means. Shown to a
            moderator as plain text — never rendered as HTML.

            **Required when `reason` is `other`**, and whitespace does not
            count: every other reason states the problem by itself, while
            `other` says only that none of them fit, which is nothing to act
            on.
      additionalProperties: false

    ModerateListingRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [remove, restore, dismiss]
          description: |
            `remove` hides the listing and marks its open reports `upheld`.
            `dismiss` leaves the listing alone and marks them `dismissed`.
            `restore` puts a removed listing back.

            There is no `escalate`: every moderator holds the same ADMIN role,
            so it would move a report from one queue to the same queue.
        note:
          type: string
          maxLength: 500
          description: |
            Why. **Required for `remove`** — an audit trail whose reason is
            empty is only a timestamp. Optional for the other two.
      additionalProperties: false

    ModerateListingResponse:
      type: object
      required: [listing, reports_resolved]
      properties:
        listing:
          $ref: "#/components/schemas/Listing"
        reports_resolved:
          type: integer
          format: int64
          description: |
            How many open reports this one action closed. Moderators act on a
            listing, not on a report, so three complaints about one listing are
            resolved together. Zero means it was acted on with nothing pending.

    ReportedListing:
      type: object
      required: [listing_id, title, seller_id, report_count, first_reported_at]
      description: |
        One row of the queue: a listing with at least one open report, oldest
        complaint first.
      properties:
        listing_id:
          type: string
          format: uuid
        title:
          type: string
        seller_id:
          type: string
          format: uuid
        removed_at:
          type: string
          format: date-time
          nullable: true
          description: Null when the listing is still visible.
        report_count:
          type: integer
          format: int64
        first_reported_at:
          type: string
          format: date-time

    Report:
      type: object
      required: [id, reason, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        reporter_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Null once the reporter deletes their account — the report survives
            them, since the complaint is about the listing, not the person.
        reason:
          type: string
          enum: [spam, prohibited, misleading, offensive, other]
        detail:
          type: string
          description: |
            Attacker-controlled text, stripped of control characters at write
            time. Render it as plain text.
        status:
          type: string
          enum: [open, upheld, dismissed]
        created_at:
          type: string
          format: date-time

    ModerationAction:
      type: object
      required: [id, listing_id, action, created_at]
      description: One entry in the audit trail. Nothing here is ever edited.
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
        moderator_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Null once that admin's account is deleted. The record outlives
            them deliberately — an audit row that vanishes with its author is
            not an audit row.
        action:
          type: string
          enum: [removed, restored, dismissed]
          description: Past tense, because the log records what was done.
        note:
          type: string
        created_at:
          type: string
          format: date-time

    Presence:
      type: object
      required: [is_online]
      description: |
        `is_online` means "seen within the last 2 minutes" (twice the
        heartbeat interval, so one missed beat is not read as offline).

        `last_seen_at` is absent when the other user has switched online
        status off, and also when they have never been seen. An offline user
        who has NOT hidden their status still sends `last_seen_at`, so an
        absent timestamp does not by itself mean "offline".

        Presence also goes dark when **either** of you has blocked the other,
        and it is never sent to an unauthenticated caller. Do not render an
        absent `last_seen_at` as "this user hid their status" - it is
        deliberately indistinguishable from a block, because telling someone
        they have been blocked is the one thing blocking must not do.
      properties:
        is_online:
          type: boolean
        last_seen_at:
          # OMITTED, not null, when unknown or hidden - the Go tag is omitempty.
          type: string
          format: date-time

    ChatUser:
      type: object
      required: [id, username, presence]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        presence:
          $ref: "#/components/schemas/Presence"

    BlockedUser:
      type: object
      description: |
        One person you have blocked. Deliberately not `ChatUser` — that carries
        `presence`, and whether someone you blocked is online is exactly what
        should stop being visible to you.
      required: [id, username, blocked_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        blocked_at:
          type: [string, "null"]
          format: date-time

    Message:
      type: object
      required: [id, conversation_id, sender_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Ascending; also the cursor for the `after` parameter.
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        body:
          type: string
        read_at:
          # Absent while unread. Contrast Order, whose timestamps are null.
          type: string
          format: date-time
          description: Absent until the recipient marks the conversation read.
        created_at:
          type: string
          format: date-time

    MessagePreview:
      type: object
      required: [body, created_at]
      properties:
        body:
          type: string
        created_at:
          type: string
          format: date-time

    ConversationStatus:
      type: string
      description: |
        `pending` until the seller answers. The buyer's opening message is
        already stored, but neither side can send another until it is
        `accepted`; `declined` closes it for good.
      enum: [pending, accepted, declined]

    ConversationRole:
      type: string
      description: Your side of THIS conversation, not a site-wide role.
      enum: [buyer, seller]

    Conversation:
      type: object
      required:
        [
          id,
          listing_id,
          listing_title,
          status,
          role,
          other_user,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          # Nullable: the FK is ON DELETE SET NULL, so a deleted listing leaves
          # the conversation intact with listing_id null.
          type: [string, "null"]
          format: uuid
        listing_title:
          type: string
          description: |
            Snapshotted when the chat started, so the thread still says what
            it was about after the listing is edited or deleted.
        status:
          $ref: "#/components/schemas/ConversationStatus"
        role:
          $ref: "#/components/schemas/ConversationRole"
        other_user:
          $ref: "#/components/schemas/ChatUser"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConversationListItem:
      type: object
      # The list shape is NOT the detail shape: it swaps created_at for a
      # preview and an unread count, which the list view needs and the
      # detail view does not.
      required:
        [
          id,
          listing_id,
          listing_title,
          status,
          role,
          other_user,
          last_message,
          unread_count,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          type: [string, "null"]
          format: uuid
        listing_title:
          type: string
        status:
          $ref: "#/components/schemas/ConversationStatus"
        role:
          $ref: "#/components/schemas/ConversationRole"
        other_user:
          $ref: "#/components/schemas/ChatUser"
        last_message:
          # Null, not absent - no omitempty on this one.
          oneOf:
            - $ref: "#/components/schemas/MessagePreview"
            - type: "null"
          description: Null on a conversation with no messages.
        unread_count:
          type: integer
          format: int64
          description: Unread messages from the other user in this thread.
        updated_at:
          type: string
          format: date-time

    UnreadCount:
      type: object
      required: [unread_count]
      properties:
        unread_count:
          type: integer
          format: int64

    UserSettings:
      type: object
      required: [show_online_status]
      properties:
        show_online_status:
          type: boolean

    UpdateSettingsInput:
      type: object
      # Required because the Go field is a *bool specifically to tell
      # "false" apart from "not sent" - and "not sent" is a 400.
      required: [show_online_status]
      properties:
        show_online_status:
          type: boolean

    OrderEvent:
      type: object
      description: |
        One entry in an order's history, written in the same transaction as the
        change it describes - so a refused transition leaves no entry, and an
        entry cannot describe something that did not happen.
      required: [id, order_id, actor_id, from_status, to_status, note, created_at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        actor_id:
          type: [string, "null"]
          format: uuid
          description: |
            Who acted. Null once that account is deleted: the event outlives
            the person, unlike a follow or a session.
        from_status:
          # Deliberately NOT the OrderStatus enum: these are historical values.
          # Migration 007 removed 'paid' from the allowed set, and rows written
          # before that still say it.
          type: [string, "null"]
          description: |
            The status before the change, or null for the event recording the
            order being placed. A plain string rather than the `OrderStatus`
            enum, because old rows may hold statuses no longer in use.
          examples: ["confirmed"]
        to_status:
          type: string
          description: |
            The status after the change. Equal to `from_status` on a handshake
            mark, where a party acted but the order did not move.
          examples: ["completed"]
        note:
          type: [string, "null"]
          description: |
            Set on handshake marks, where `from_status` equals `to_status` and
            the status alone cannot say who acted. Null on ordinary
            transitions.

            A stable code, not display text - `seller_handover` or
            `buyer_receipt` - so a client renders it in its own language.
            Rows already written cannot be re-translated.
          examples: ["seller_handover"]
        created_at:
          type: string
          format: date-time

    # --- profiles --------------------------------------------------------------

    ProfileUpdate:
      type: object
      description: |
        Every field is optional and each accepts three states, so a PATCH can
        say "leave this alone", "clear it", or "set it" per field:

        | Sent | Effect |
        |---|---|
        | key absent | keep the current value |
        | `null` **or** `""` | clear the field to `null` |
        | a value | replace it (surrounding whitespace is trimmed) |

        Note `null` and `""` behave the same. RFC 7396 merge-patch would treat
        `""` as a value; this API treats an empty string as "clear", because a
        form that submits a cleared input sends `""` rather than `null`.

        Unknown fields are rejected with a 400 - with every field optional, a
        typo is otherwise indistinguishable from an omission.
      additionalProperties: false
      properties:
        firstname:
          type: [string, "null"]
          maxLength: 150
        lastname:
          type: [string, "null"]
          maxLength: 150
        bio:
          type: [string, "null"]
          maxLength: 1000
        phone_number:
          type: [string, "null"]
          maxLength: 15
        date_of_birth:
          type: [string, "null"]
          format: date
          description: |
            `YYYY-MM-DD`. Rejected if it is not a plain date, is in the future,
            or falls before 1900.
          examples: ["2001-05-14"]
        location:
          type: [string, "null"]
          maxLength: 100
          description: |
            Free text, stored on the user's address rather than the profile.
            This is what the `location` filter on `/listings/search` matches.
          examples: ["Espoo"]

    OwnProfile:
      type: object
      description: |
        Your own profile. Unset fields are `null` rather than absent, so a form
        can render an empty input without deciding whether the key exists.
      required:
        [id, username, email, firstname, lastname, bio, phone_number, date_of_birth, location, avatar_url]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        firstname:
          type: [string, "null"]
        lastname:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        phone_number:
          type: [string, "null"]
        date_of_birth:
          type: [string, "null"]
          format: date
          examples: ["2001-05-14"]
        location:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
          description: |
            Path served by the API, or `null` when none is set. The default
            avatar is the client's decision, not a URL the API invents.
          examples: ["/uploads/0a7a0bc6-99f9-42f8-9ba0-c908a9cb3a93.png"]

    PublicProfile:
      type: object
      description: |
        Somebody else's profile. `email`, `phone_number` and `date_of_birth`
        are not blanked here - the shape has no such fields, so they cannot be
        exposed by an oversight.
      required: [id, username, firstname, lastname, bio, location, avatar_url, presence]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        firstname:
          type: [string, "null"]
        lastname:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        location:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
          description: |
            Path served by the API, or `null` when none is set. The default
            avatar is the client's decision, not a URL the API invents.
          examples: ["/uploads/0a7a0bc6-99f9-42f8-9ba0-c908a9cb3a93.png"]
        presence:
          $ref: "#/components/schemas/Presence"

  # Whole reusable responses, not just schemas - status code descriptions we
  # would otherwise retype on all 35 operations.
  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json: # the media type the body is sent as
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        No token, or one that is expired or invalid. The body is the same in
        every case; `WWW-Authenticate` says which, because a client's response
        differs: refresh, or log in.
      headers:
        WWW-Authenticate:
          description: |
            `Bearer error="invalid_token", error_description="The access token expired"`
            when the token was valid but has aged out - retry through
            `POST /auth/refresh`. A bare `Bearer` for a missing, malformed or
            forged token - the client should log in. A forged token reads as
            absent on purpose.
          schema:
            type: string
          examples:
            expired:
              value: Bearer error="invalid_token", error_description="The access token expired"
            absent:
              value: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Authenticated, but not permitted — the resource belongs to someone
        else, or the account does not hold the role the route requires.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        No such resource — also returned when a resource exists but the caller
        is not a participant, so its existence is not revealed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: |
        Too many requests on this API key. Only key-authenticated requests are
        limited; browser sessions are not.
      headers:
        Retry-After:
          description: Seconds until a request will be accepted again.
          schema:
            type: integer
            examples: [2]
        X-RateLimit-Limit:
          description: |
            The bucket's capacity. Sent on every key-authenticated response,
            not only on a refusal.
          schema:
            type: integer
            examples: [60]
        X-RateLimit-Remaining:
          description: Requests left in the current bucket.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Something failed on our side; the cause is in the log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

# Each key is a URL relative to the server above, so "/listings" is really
# http://localhost:8080/api/v1/listings.
paths:
  # ---------------------------------------------------------------------------
  # auth
  # ---------------------------------------------------------------------------
  /auth/signup:
    post: # the HTTP method is the second level: path -> method -> operation
      tags: [auth] # which section of the UI this lands in
      summary: Create an account
      operationId: signup # unique id; client generators use it as the func name
      # Overrides the document-wide default: no token needed (you have none yet).
      security: []
      description: |
        Creates the user and their empty profile in one transaction, then
        returns an access token. The refresh token is set as an HttpOnly
        `refresh_token` cookie rather than returned in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        # Status codes are quoted - unquoted YAML would read them as numbers.
        "201":
          description: Account created.
          headers:
            Set-Cookie:
              description: HttpOnly `refresh_token`, valid for 7 days.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: |
            That email or username is already taken. Both are unique **ignoring
            case and surrounding whitespace** — `Forager`, `forager` and
            ` forager ` are the same account — and the message says which
            clashed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated.
          headers:
            Set-Cookie:
              description: HttpOnly `refresh_token`, valid for 7 days.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            Wrong password, or no such account. Deliberately the same message
            either way, so this cannot be used to discover which emails exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Ask for a password reset link
      operationId: forgotPassword
      security: []
      description: |
        **Always 202**, whether or not an account exists for that address.
        Reporting "no such account" would let anyone test an address list and
        learn who is registered, so the response is deliberately uninformative
        — a typo looks exactly like success.

        A new link supersedes any earlier one, so asking twice leaves one
        working key rather than two. Requests inside a short cooldown are
        silently ignored, which is also indistinguishable from success: this
        endpoint is unauthenticated and sends mail, so without a cooldown it is
        a way to make this server send email on someone else's behalf.

        The link expires in an hour and works once.

        **An account that signs in with Google or GitHub has no password, and
        this will not create one.** That address gets an email naming the
        provider instead of a link. A reset cannot mint a credential for an
        account that never had one: GitHub hands over a verified address that
        may live at any mailbox, so a password would drop the account to the
        weaker of mailbox and provider and walk past the provider's 2FA.

        The response, the timing and the cooldown are identical either way —
        only the words in the email differ, and only the mailbox owner reads
        them. Adding a password to a provider account is an authenticated
        action, not something an unauthenticated endpoint can do.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: |
            Accepted. This says nothing about whether an account exists, or
            whether an email was in fact sent.
        "400":
          description: |
            Bad body, an unknown field, or an empty email. This distinguishes
            malformed input from everything else — never whether an address is
            registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Set a new password from a reset link
      operationId: resetPassword
      security: []
      description: |
        Spends the token, sets the password, and revokes **every refresh token
        and every API key** for that user, all in one transaction. Revoking is
        the point rather than a detail: people reset precisely when they think
        someone else has their password. API keys matter especially, because
        they never expire — one created during a compromise would otherwise
        outlive the reset indefinitely.

        **One thing survives**: an access token already issued stays valid until
        it expires, up to `ACCESS_TOKEN_TTL` (15 minutes by default). JWTs are
        verified by signature alone and nothing consults the database, so there
        is no way to revoke one. An attacker holding a live access token keeps
        access for the remainder of that window; they simply cannot renew it.

        No session is returned and no cookie is set. Following the link proves
        control of the mailbox, not of the account, so the next step is
        `POST /auth/login` with the new password.

        Unknown, expired and already-used tokens are one 401 with one message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed and every session ended. No body.
        "400":
          description: |
            Bad body, an unknown field, or a password outside the 8–72 byte
            limits. The limits are bytes, not characters — bcrypt truncates
            past 72.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            The link is unknown, expired or already used — deliberately not
            distinguished, so the endpoint cannot confirm which tokens once
            existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/logout:
    post:
      tags: [auth]
      summary: Clear the refresh token cookie
      operationId: logout
      security: []
      description: |
        Ends **every** session for this account and expires the
        `refresh_token` cookie, so refreshing stops working immediately - it
        does not get the rotation grace window.

        All sessions rather than only the presented one: if that token had
        already been rotated, its successor would otherwise stay live for a
        week while the client was told it had logged out. The cost is that
        logging out on one device logs you out on the others.

        The access token is stateless and cannot be revoked, so it stays valid
        until it expires (up to 15 minutes); the client should drop it too.
        Succeeds even if you were never logged in.
      responses:
        "204":
          description: Cookie cleared. No body.
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange the refresh cookie for a new access token
      operationId: refresh
      security: []
      description: |
        Reads the `refresh_token` cookie - there is no request body, and no
        bearer token is needed, since you are refreshing precisely because the
        access token is gone.

        **The refresh token is rotated.** A new one is set on the cookie and
        the old one is revoked.

        To keep two browser tabs from logging each other out, a just-rotated
        token stays usable for 30 seconds - but it rotates only once. A replay
        inside that window returns a new access token and **no** `Set-Cookie`,
        because the request that won the rotation already put the current token
        in the shared cookie jar. After the window, presenting it again is a
        401.

        The response is the same shape as signup and login, so a client sets
        its session from any of the three with one code path - and recovering
        from a 401 costs one round trip rather than two.
      responses:
        "200":
          description: A new access token, and the identity behind it.
          headers:
            Set-Cookie:
              description: |
                The rotated HttpOnly `refresh_token`, valid for 7 days. Absent
                when this request was a replay inside the grace window and did
                not win the rotation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: |
            The cookie is missing, unknown, expired, revoked by a logout, or
            rotated more than 30 seconds ago. One answer for all of them: the
            client's move is the same, and distinguishing them would reveal
            which tokens once existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/oauth/{provider}:
    get:
      tags: [auth]
      summary: Start signing in with a provider
      operationId: oauthStart
      security: []
      description: |
        A redirect, not an API call — link to it, do not fetch it. Sends the
        browser to the provider's consent screen and sets a short-lived
        HttpOnly `oauth_state` cookie that the callback checks.

        Returns 404 when the provider has no credentials configured for this
        deployment, so a build with no Google client id simply has no Google
        button.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
      responses:
        "302":
          description: Redirect to the provider.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: HttpOnly `oauth_state`, valid for 10 minutes.
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      summary: Finish signing in with a provider
      operationId: oauthCallback
      security: []
      description: |
        Where the provider sends the browser back. Never returns JSON on
        failure — the caller is a browser following a redirect, so every
        outcome is a 302 to the frontend's `/auth/callback` carrying either
        `status=ok` or an `error` slug: `access_denied`, `invalid_state`,
        `invalid_request`, `no_email`, `email_in_use`, `already_linked`,
        `retry`, `server_error`.

        `email_in_use` means the address belongs to an account that has a
        password. Signup does not verify addresses, so that account may have
        been registered by someone who does not own this one — linking it
        automatically would be an account takeover. The owner signs in with
        their password instead.

        On success only the `refresh_token` cookie is set — an access token in
        a redirect URL would end up in browser history and proxy logs. The
        frontend calls `POST /auth/refresh` to get one.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
        - name: code
          in: query
          description: The authorization code, exchanged server-side.
          schema:
            type: string
        - name: state
          in: query
          description: Must match the `oauth_state` cookie, or the flow stops.
          schema:
            type: string
        - name: error
          in: query
          description: Set by the provider when the user declined.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the frontend, signed in or with an error slug.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: HttpOnly `refresh_token`, valid for 7 days, on success.
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/me:
    get:
      tags: [auth]
      summary: Who this session belongs to
      operationId: getCurrentUser
      description: |
        For restoring a session on page load: the access token is still valid,
        only the user object was lost. Refreshing would work too, but it would
        rotate a perfectly good session to answer a question about identity.

        Deliberately not `GET /me/profile`, which is about profile data, is
        assembled from three tables, and carries no `role`.
      responses:
        "200":
          description: The identity behind the token - the same object nested under `user` elsewhere.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The account behind this token no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # listings (public reads)
  # ---------------------------------------------------------------------------
  /listings:
    get:
      tags: [listings]
      summary: List the available listings
      operationId: getListings
      security: []
      description: |
        Newest first, and **sold-out listings are excluded** (`quantity > 0`).
        A sold-out listing is still reachable through `/listings/{id}` and
        still appears in `/me/saved`.

        Unpaginated — use `/listings/search` for filtering, sorting and pages.
      responses:
        "200":
          description: The available listings, each with its photos attached.
          content:
            application/json:
              schema:
                # An array response has no named schema; describe it inline.
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      tags: [listings]
      summary: Create a listing
      operationId: createListing
      # No "security" override here: the document default (bearer token)
      # applies, which is exactly what this endpoint needs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: |
            Created. `images` is always `[]` here — upload photos afterwards
            with `POST /listings/{id}/images`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /listings/search:
    get:
      tags: [listings]
      summary: Search, filter, sort and paginate listings
      operationId: searchListings
      security: []
      description: |
        Every parameter is optional; omitting one means "no filter". Sold-out
        listings are excluded, as in `GET /listings`.

        `keyword` and `location` match case-insensitively on a substring, with
        `%` or `_` in the input treated literally rather than as SQL
        wildcards. `category` is an exact, case-SENSITIVE match.
      parameters:
        # in: query = ?keyword=... . Optional unless "required: true".
        - name: keyword
          in: query
          description: Matches the title or description.
          schema:
            type: string
            maxLength: 200
          examples:
            chanterelle:
              value: chanterelle
        - name: category
          in: query
          schema:
            type: string
            maxLength: 200
          examples:
            mushrooms:
              value: mushrooms
        - name: location
          in: query
          description: |
            Matches the seller's address, not the listing — a listing whose
            seller has no address is never returned by this filter.
          schema:
            type: string
            maxLength: 200
        - name: min_price
          in: query
          description: Non-negative. Must not exceed `max_price`.
          schema:
            type: number
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: number
            minimum: 0
        - name: sort
          in: query
          description: Anything outside this list is a 400.
          schema:
            type: string
            # Mirrors the sortOptions map in database/listings_search.go.
            enum: [newest, oldest, price_asc, price_desc]
            default: newest
        - name: page
          in: query
          description: 1-based. A page past the end returns an empty `items`.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Values above 50 are clamped to 50 rather than rejected.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of matches, plus the totals for a pager.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedListings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /listings/{id}:
    # Declared at path level, so every method on this path inherits it.
    # {id} in the path and "name: id" here have to match exactly.
    parameters:
      - name: id
        in: path
        required: true # path parameters are ALWAYS required
        schema:
          type: string
          format: uuid
    get:
      tags: [listings]
      summary: Get one listing
      operationId: getListing
      security: []
      responses:
        "200":
          description: The listing, with its photos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [listings]
      summary: Replace a listing
      operationId: updateListing
      description: |
        A full replace, not a patch: every required field must be sent, and an
        omitted `description` is stored as empty. Sellers only — and a listing
        whose quantity has reached 0 can no longer be edited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "200":
          description: The updated listing, with its photos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The listing is sold out; create a new one instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [listings]
      summary: Delete a listing
      operationId: deleteListing
      description: |
        Refused once the listing has orders — the order history has to keep
        pointing at something, so the foreign key is ON DELETE RESTRICT.
      responses:
        "204":
          description: Deleted. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The listing has orders and cannot be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /listings/{id}/report:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [listings]
      summary: Report a listing
      operationId: reportListing
      description: |
        Files a flag for a moderator. **The listing is not changed in any way** —
        not hidden, not flagged publicly, and the seller is not told. A report
        that hid a listing would let anyone with two accounts remove a
        competitor's.

        One report per person per listing; a second is a 409, which tells you
        your concern is already on record.

        There is no way to read reports here, or to see how many a listing has.
        The moderation queue is admin-only, and a public count would itself be
        a weapon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportListingRequest"
      responses:
        "204":
          description: Filed. No body — there is no status for you to follow.
        "400":
          description: |
            Bad body, an unknown reason, detail over 500 characters, a
            missing detail on an `other` report, or your own listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: You have already reported this listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /listings/{id}/images:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [images]
      summary: List a listing's photos
      operationId: getListingImages
      security: []
      description: |
        Ordered by `position`. A listing id that does not exist returns an
        empty array, not a 404.
      responses:
        "200":
          description: The photos, ascending by position.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListingImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      tags: [images]
      summary: Upload a photo
      operationId: uploadListingImage
      description: |
        `multipart/form-data` with one file field named `image`. The type is
        decided by sniffing the file's first 512 bytes, not by the filename or
        the client's Content-Type — so a `.png` that is really a PDF is a 415.

        Limits come from the environment: `MAX_UPLOAD_BYTES` (default 5 MiB)
        and `MAX_IMAGES_PER_LISTING` (default 5).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary # "this field is a file", not text
      responses:
        "201":
          description: |
            Stored. `position` is one past the highest already in use, so a
            gap left by a deleted photo is never reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingImage"
        "400":
          description: Not a multipart form, or no `image` field in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This listing already has the maximum number of images.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The upload exceeded `MAX_UPLOAD_BYTES`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Not a JPEG, PNG or WebP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # served outside /api/v1 - hence the per-path "servers" override below
  # ---------------------------------------------------------------------------
  /health:
    # A path may override the document's servers. Without this, the docs would
    # claim /api/v1/health, which does not exist.
    servers:
      - url: /
        description: Mounted at the root, not under /api/v1
    get:
      tags: [health]
      summary: Liveness and dependency check
      operationId: health
      security: []
      responses:
        "200":
          description: Everything is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A dependency is down; `checks` says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /uploads/{filename}:
    servers:
      - url: /
        description: Mounted at the root, not under /api/v1
    get:
      tags: [images]
      summary: Fetch an uploaded image file
      operationId: getUpload
      security: []
      description: |
        Serves the bytes behind a `ListingImage.url`. Filenames are generated
        by the server; a name containing `/` is a 404, so the directory cannot
        be walked. Responses carry `X-Content-Type-Options: nosniff`.
      parameters:
        - name: filename
          in: path
          required: true
          description: Bare filename, no directories.
          schema:
            type: string
          examples:
            png:
              value: 0a7a0bc6-99f9-42f8-9ba0-c908a9cb3a93.png
      responses:
        "200":
          description: The image bytes.
          content:
            # Binary responses: name the media types, no schema needed.
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "206":
          description: |
            A byte range, when the request carried a `Range` header. These
            files are served by net/http's file server, which supports ranges.
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "304":
          description: |
            Unchanged since the `If-Modified-Since` the request carried. No
            body. These responses carry `Last-Modified` but no `ETag`.
        "404":
          description: No such file. Plain text, not the JSON error envelope.
          content:
            text/plain: {}

  /listings/{id}/images/{imageID}:
    # Two path parameters. Note the casing: chi's route says {imageID}, so the
    # spec has to say {imageID} too.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: imageID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [images]
      summary: Delete a photo
      operationId: deleteListingImage
      description: |
        Removes the row and the file. Remaining photos keep their positions;
        gaps are allowed.
      responses:
        "204":
          description: Deleted. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # wishlist
  # ---------------------------------------------------------------------------
  /listings/{id}/save:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [wishlist]
      summary: Save a listing
      operationId: saveListing
      description: |
        Idempotent — saving a listing you already saved is still a 204, not a
        409 (the insert is `ON CONFLICT DO NOTHING`).
      responses:
        "204":
          description: Saved. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [wishlist]
      summary: Remove a listing from the wishlist
      operationId: unsaveListing
      description: |
        NOT idempotent, unlike save: removing something you had not saved is a
        404 ("listing was not saved").
      responses:
        "204":
          description: Removed. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}/follow:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [follows]
      summary: Follow a user
      operationId: followUser
      description: |
        Idempotent - following someone you already follow is still a 204. The
        edge is one-directional: this says nothing about whether they follow
        you back.
      responses:
        "204":
          description: Followed. No body.
        "400":
          description: The id is not a UUID, or it is your own - you cannot follow yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [follows]
      summary: Unfollow a user
      operationId: unfollowUser
      description: |
        Idempotent, like follow: unfollowing someone you were not following is
        still a 204, because not following them is the state you asked for.
        There is no 404 - "you were not following them" is not something a
        client can act on, and it would turn a retried mutation into a spurious
        error.
      responses:
        "204":
          description: Unfollowed. No body.
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}/block:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [blocks]
      summary: Block a user
      operationId: blockUser
      description: |
        Stops messaging in **both** directions: neither of you can start a
        conversation with the other or send into an existing one. One-way would
        leave the blocker able to open a thread the blocked party cannot answer.

        Idempotent — blocking someone already blocked is still a 204.

        A block does **not** remove a follow, and it does not affect orders. If
        the two of you have a sale in progress, `confirm`, `handover` and
        `receive` keep working: blocking is about messaging, and letting it
        strand an order would turn a safety feature into a way to break
        someone's transaction.
      responses:
        "204":
          description: Blocked. No body.
        "400":
          description: The id is not a uuid, or it is your own - you cannot block yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [blocks]
      summary: Unblock a user
      operationId: unblockUser
      description: |
        Restores messaging both ways, and the existing thread reappears in your
        inbox. Idempotent, like unfollow: unblocking someone who was not
        blocked is still a 204, since that is the state you asked for.
      responses:
        "204":
          description: Unblocked. No body.
        "400":
          description: The id is not a uuid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}/followers:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [follows]
      summary: List a user's followers
      operationId: getFollowers
      description: |
        Alphabetical by username, and unpaginated - deliberately, unlike
        listings: a follow list is bounded by how many people one person
        chooses to follow, while a catalogue is not. Revisit if these ever
        run to hundreds. Requires a token: a follower list is a social graph
        rather than public profile data.
      responses:
        "200":
          description: The people following that user, each with online status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatUser"
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}/following:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [follows]
      summary: List who a user follows
      operationId: getUserFollowing
      description: |
        The mirror of `/users/{id}/followers`, and public on the same terms:
        who someone follows is no more private here than who follows them, and
        hiding one but not the other would be an asymmetry rather than a
        privacy design. `/me/following` is the same list for the authenticated
        caller, without needing to know your own id.
      responses:
        "200":
          description: The people that user follows, each with online status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatUser"
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/avatar:
    post:
      tags: [me]
      summary: Set or replace your avatar
      operationId: uploadAvatar
      description: |
        `multipart/form-data` with one file field named `avatar`. The type is
        decided by sniffing the file's first 512 bytes, not by the filename or
        the client's Content-Type — so a `.png` that is really a PDF is a 415.
        `MAX_UPLOAD_BYTES` (default 5 MiB) caps the size.

        200 rather than 201: an avatar is singular, so posting again replaces
        the current one and deletes the file it displaced. Uploading twice is
        not a conflict, and there is never more than one to address.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stored, and any file it replaced deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Avatar"
        "400":
          description: Not a multipart form, or no `avatar` field in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The upload exceeded `MAX_UPLOAD_BYTES`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Not a JPEG, PNG or WebP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [me]
      summary: Revert to the default avatar
      operationId: deleteAvatar
      description: |
        Clears the avatar and deletes the stored file. Idempotent — clearing an
        avatar nobody set is still a 204, since the end state is identical.
      responses:
        "204":
          description: No avatar is set; `avatar_url` is now `null`.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/profile:
    get:
      tags: [me]
      summary: Get your own profile
      operationId: getOwnProfile
      responses:
        "200":
          description: Your profile, including the fields only you can see.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The account behind this token no longer exists. Signup creates the
            profile row, so a missing profile means a missing user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags: [me]
      summary: Update your own profile
      operationId: updateOwnProfile
      description: |
        A partial update: fields you do not mention keep their current value.
        Both halves are written in one transaction, since `location` lives on
        the address rather than the profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The profile after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnProfile"
        "400":
          description: |
            A malformed body, an unknown field, a value over its limit, a
            string containing a null byte, or a `date_of_birth` that is not a
            plain past date after 1900.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/blocks:
    get:
      tags: [blocks, me]
      summary: List the people you have blocked
      operationId: getBlocks
      description: |
        Alphabetical by username, unpaginated. No `presence` — see `BlockedUser`.

        There is no endpoint for who *someone else* has blocked, or for who has
        blocked you. Both are deliberately absent rather than filtered.
      responses:
        "200":
          description: The people you have blocked.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/following:
    get:
      tags: [follows, me]
      summary: List the people you follow
      operationId: getFollowing
      description: |
        The "friends list". Alphabetical by username, unpaginated, and each row
        carries `presence` - so a client renders online status without a
        request per person.
      responses:
        "200":
          description: The people you follow.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [me]
      summary: Get someone else's public profile
      operationId: getPublicProfile
      security: []
      description: |
        Public, like the listing reads - a seller's profile should be readable
        while browsing. `presence` honours that user's `show_online_status`:
        with it off, the response is `{"is_online": false}` with no
        `last_seen_at`.

        **Presence needs a token.** Called without one it is always
        `{"is_online": false}` - the rest of the profile is public, but an
        anonymous caller cannot read anyone's online status. Otherwise a
        blocked user could read the blocker's presence by logging out.
        Presence is also hidden when either party has blocked the other.
      responses:
        "200":
          description: The public view of that profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/saved:
    get:
      tags: [wishlist, me]
      summary: List your saved listings
      operationId: getSavedListings
      description: Unpaginated. Photos are attached in one batch query.
      responses:
        "200":
          description: Your wishlist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # orders (simulated - no real money moves)
  # ---------------------------------------------------------------------------
  /orders:
    post:
      tags: [orders]
      summary: Place an order
      operationId: createOrder
      description: |
        Decrements the listing's stock in the same transaction, so two buyers
        racing for the last item cannot both succeed. Starts as `pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Order placed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: |
            Bad body, non-positive quantity, or your own listing — you cannot
            buy from yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not enough stock available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [orders]
      summary: List your orders
      operationId: getOrders
      description: Every order where you are the buyer OR the seller.
      responses:
        "200":
          description: Your orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [orders]
      summary: Get one order
      operationId: getOrder
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [orders]
      summary: An order's history
      operationId: getOrderEvents
      description: |
        Every transition the order made, oldest first: who did what, and when.
        A completed order has five entries - placed, confirmed, both halves of
        the handshake, and the completion.

        The two handshake entries share a `created_at`, because they are
        written in one transaction; they are ordered by `id` behind it.

        Buyer and seller only.
      responses:
        "200":
          description: The timeline, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            You are not the buyer or the seller. Note orders answer this with
            403 where conversations answer 404 - so an outsider can tell that
            an order id exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [orders]
      summary: Seller accepts the order
      operationId: confirmOrder
      description: "`pending` → `confirmed`. Seller only."
      responses:
        "200":
          description: The order, now `confirmed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The order is not `pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}/handover:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [orders]
      summary: Seller marks the goods handed over
      operationId: handoverOrder
      description: |
        Half of the two-sided handshake. Stamps `seller_handed_over_at`; the
        status only becomes `completed` once the buyer has called `/receive`
        as well. Calling it twice is a 409.
      responses:
        "200":
          description: |
            The order — `completed` if the buyer already confirmed receipt,
            otherwise still `confirmed` with the timestamp now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Wrong status, or you already marked handover.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}/receive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [orders]
      summary: Buyer confirms receipt
      operationId: receiveOrder
      description: |
        The other half of the handshake. Stamps `buyer_received_at`; the
        status becomes `completed` only once the seller has handed over too.
      responses:
        "200":
          description: The order, `completed` if both sides have now marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Wrong status, or you already confirmed receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [orders]
      summary: Cancel an order
      operationId: cancelOrder
      description: |
        Either side, while the order is `pending` or `confirmed`. The reserved
        stock goes back to the listing. Once either side has marked the
        handshake, cancelling is refused.
      responses:
        "200":
          description: The order, now `cancelled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already finished, or handover has started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # chat
  # ---------------------------------------------------------------------------
  /conversations:
    post:
      tags: [chat]
      summary: Ask a seller about a listing
      operationId: startConversation
      description: |
        Creates the conversation as `pending` and stores your opening message
        in the same transaction. One conversation per (listing, buyer): asking
        twice about the same listing is a 409, not a second thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationInput"
      responses:
        "201":
          description: Created, awaiting the seller's answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: |
            Bad body, an empty message, or your own listing — you cannot start
            a chat with yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            A block exists between you and the seller, in either direction. The
            message does not say so — it reads the same as any other closed
            thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: You have already contacted this seller about this listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [chat]
      summary: List your conversations
      operationId: getConversations
      description: |
        Both sides, newest activity first. Each item carries a preview and an
        unread count, so the inbox needs one request rather than one per thread.
      responses:
        "200":
          description: Your conversations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [chat]
      summary: Get one conversation
      operationId: getConversation
      description: |
        404 rather than 403 if you are not a participant, so this cannot be
        used to discover which conversations exist.
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /conversations/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [chat]
      summary: Seller accepts a chat request
      operationId: acceptConversation
      description: "`pending` → `accepted`. Seller only. No request body."
      responses:
        "200":
          description: The conversation, now `accepted`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the seller can answer a chat request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This request has already been answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /conversations/{id}/decline:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [chat]
      summary: Seller declines a chat request
      operationId: declineConversation
      description: |
        `pending` → `declined`, which is final: neither side can send again,
        and the buyer cannot re-open by asking about the same listing.
      responses:
        "200":
          description: The conversation, now `declined`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the seller can answer a chat request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This request has already been answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /conversations/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [chat]
      summary: Read a conversation's messages
      operationId: getMessages
      description: |
        Always ascending by id. Two modes:

        - **no `after`** — the most recent `limit` messages (opening a thread).
        - **`after=<id>`** — everything newer than that id (the polling loop:
          keep the highest id you have seen and pass it back).

        Readable while the conversation is still `pending`, even though
        sending is not.
      parameters:
        - name: after
          in: query
          description: |
            Return only messages newer than this one. Omit it for the first
            page. Ids are uuid v7, so they sort chronologically and this stays
            a stable cursor even for two messages sent in the same
            millisecond.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: |
            Values above 100 are clamped to 100 rather than rejected, and 0
            means "use the default". Anything past the int32 maximum is a 400.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 50
      responses:
        "200":
          description: Messages, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [chat]
      summary: Send a message
      operationId: sendMessage
      description: |
        Only once the conversation is `accepted`. While it is `pending` the
        buyer's opening message is the only one allowed, so this is a 409.

        A block between the two participants is a 403, checked after the status
        rules — so a `pending` thread still returns its 409 first, and blocking
        does not change the response for a thread that was already refusing
        messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Bad body, empty after trimming, or over 2000 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            A block exists between the two participants, in either direction.
            Checked after the status rules, so a pending thread still returns
            its 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not accepted yet, or the request was declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /conversations/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [chat]
      summary: Mark the other side's messages as read
      operationId: markConversationRead
      description: |
        Stamps `read_at` on the other user's unread messages, which is what
        clears this thread from `/me/unread`. Idempotent, and no request body.
      responses:
        "204":
          description: Marked. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # me
  # ---------------------------------------------------------------------------
  /me/api-keys:
    post:
      tags: [me]
      summary: Create an API key
      operationId: createAPIKey
      # Bearer only: a key must not be able to mint another key.
      security:
        - bearerAuth: []
      description: |
        Returns the key **once**. Only its SHA-256 hash is stored, so there is
        no endpoint that can show it again - if it is lost, revoke it and
        create another.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKey"
      responses:
        "201":
          description: The key, for the only time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: An API key cannot manage API keys; log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [me]
      summary: List your API keys
      operationId: getAPIKeys
      security:
        - bearerAuth: []
      description: |
        Never includes the keys themselves - only the prefix, which is enough
        to tell one row from another.
      responses:
        "200":
          description: Your keys, newest first. Revoked ones are included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: An API key cannot manage API keys; log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [me]
      summary: Revoke an API key
      operationId: revokeAPIKey
      security:
        - bearerAuth: []
      description: |
        Takes effect on the next request - the key is looked up every time, so
        there is no cache to wait out.
      responses:
        "204":
          description: Revoked. No body.
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: An API key cannot manage API keys; log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            No such key of yours. Someone else's key and one you already
            revoked answer the same way, so this cannot be used to discover
            which ids exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/settings:
    get:
      tags: [me]
      summary: Get your settings
      operationId: getSettings
      responses:
        "200":
          description: Your settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags: [me]
      summary: Update your settings
      operationId: updateSettings
      description: |
        Turning `show_online_status` off makes you look permanently offline to
        everyone else — your presence stops being reported, not just hidden.
        Omitting the field entirely is a 400, not a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsInput"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/unread:
    get:
      tags: [me, chat]
      summary: Your total unread message count
      operationId: getUnreadCount
      description: Across every conversation — for a badge in the header.
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/reports:
    get:
      tags: [moderation]
      summary: The moderation queue
      operationId: getReportQueue
      description: |
        Every listing with at least one open report, oldest complaint first.

        Grouped **by listing, not by report** — three people reporting one
        listing is one problem, and one decision resolves all three.
      responses:
        "200":
          description: The queue. An empty array means nothing is pending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportedListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/listings/{id}/reports:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [moderation]
      summary: Every report filed against one listing
      operationId: getListingReports
      description: |
        The detail behind a queue row, resolved ones included, newest first —
        a listing reported before and cleared is context for deciding again.
      responses:
        "200":
          description: The reports. Empty if the listing was never reported.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/listings/{id}/moderation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [moderation]
      summary: What moderators have done to this listing
      operationId: getModerationHistory
      description: |
        The audit trail, newest first. Append-only: nothing here is edited or
        deleted, so a listing removed and restored shows both.
      responses:
        "200":
          description: The actions. Empty if it was never moderated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModerationAction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/listings/{id}/moderate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [moderation]
      summary: Decide a reported listing
      operationId: moderateListing
      description: |
        One transaction: set or clear the listing's removed state, resolve
        every open report against it, and write the audit row. Either all
        three happen or none do.

        Removal is a state, not a delete — a listing anyone has ordered cannot
        be deleted at all, and deleting one would take the reports explaining
        why with it.

        **The listing's images stop being served too.** Removal moves the files
        out of the public upload directory and `restore` moves them back, so a
        URL handed out before the removal stops working. Without that the
        listing would be hidden while the content that caused the removal kept
        serving to anyone holding the link.

        A removed listing is **404 everywhere** — browse, search, fetch by id,
        images, ordering, chat and saving. Only its seller and admins can still fetch
        it, and only then does `removed_at` appear on the listing. Anything
        else would let the API confirm that a named seller was moderated.

        Orders placed before removal are untouched and stay cancellable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerateListingRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerateListingResponse"
        "400":
          description: |
            Bad body, an unknown action, a note over 500 characters, or a
            `remove` with no reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Removing an already-removed listing, restoring one that is not
            removed, or dismissing the reports on a removed one. The first two
            usually mean another moderator got there first; the third would
            clear the queue while leaving the listing invisible and reachable
            only by uuid, so restore it first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"
