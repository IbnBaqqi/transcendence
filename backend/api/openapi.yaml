# The OpenAPI version this document is written in - not our API's version.
# 3.1 is the JSON-Schema-aligned one; Swagger UI 5.x renders it.
openapi: 3.1.0

# Who/what this API is. Swagger UI shows this block at the top of the page.
info:
  title: Foraged goods marketplace API
  version: 0.1.0
  # "|" keeps the newlines - the description renders as Markdown in the UI.
  description: |
    A marketplace for foraged goods — berries, mushrooms, herbs. Sellers post
    listings, buyers browse, message them and place orders. Payments are
    simulated; no money changes hands.

    ## Authentication

    Two tokens, with opposite properties.

    The **access token** is a signed JWT sent on every request:

        Authorization: Bearer <access_token>

    It is verified without touching the database, which also means it cannot be
    revoked - so it is short-lived (15 minutes by default, `ACCESS_TOKEN_TTL`).

    The **refresh token** is an opaque value in an HttpOnly `refresh_token`
    cookie, set by signup and login and valid for 7 days. `POST /auth/refresh`
    exchanges it for a new access token and rotates it. Only its hash is
    stored, so a database leak cannot resume a session.

    `POST /auth/reset-password` revokes every refresh token and API key for
    that user, since a forgotten password is often a compromised one. Existing
    tabs stop working once their access token expires, so a client should treat
    the next 401 as "log in again" rather than as a bug. An access token issued
    before the reset keeps working until it expires - it cannot be revoked.

    When an access token expires, the 401 carries
    `WWW-Authenticate: Bearer error="invalid_token"` - the signal to refresh
    rather than to show a login screen. `GET /auth/me` returns the identity
    behind a token that is still valid, for restoring a session on page load.

    Public endpoints (browsing listings, search, images) work without one.

    ## Ids

    Every id is a **uuid v7**: the leading 48 bits are a millisecond timestamp,
    so ids sort chronologically and carry their own creation time. Treat them
    as opaque strings - the ordering is safe to rely on for cursors, but not
    something to parse.

    ## Errors

    Errors from the endpoints below are all the same shape:
    `{"error": "..."}`. Messages on 4xx describe what the caller did wrong
    and are written for display - sentence case, no trailing full stop. 5xx
    always returns a fixed "Something went wrong" and the detail goes to
    the server log, tagged with the `X-Request-ID` returned on every response.

    Two cases bypass that envelope, because they never reach a handler: an
    unrouted path returns a plain-text 404, and a routed path called with the
    wrong method returns an empty 405.

# The base URL every path in this file is relative to. Because /api/v1 lives
# here, paths below can be written as /listings instead of /api/v1/listings.
servers:
  - url: /api/v1
    description: Relative, so "Try it out" follows whatever host serves the docs

# Tags are just grouping labels; each operation names one and Swagger UI
# renders one collapsible section per tag.
tags:
  - name: auth
    description: Signup, login, logout
  - name: listings
    description: Browsing, searching and managing listings
  - name: images
    description: Listing photos
  - name: health
    description: Liveness and dependency checks
  - name: wishlist
    description: Saved listings
  - name: orders
    description: The simulated order lifecycle
  - name: chat
    description: Buyer/seller conversations
  - name: follows
    description: The social graph - who follows whom
  - name: blocks
    description: Who has refused contact with whom
  - name: me
    description: The authenticated user's own resources
  - name: moderation
    description: Admin-only review of reported listings
  - name: admin
    description: Admin-only management of orders and accounts

# A list here means OR: send either a bearer token or an API key. Individual
# public operations switch it off with an empty "security: []", and the
# key-management operations narrow it back to bearerAuth alone.
security:
  - bearerAuth: []
  - apiKeyAuth: []

# "components" is the reusable-definitions section. Nothing in here appears in
# the docs on its own - it only shows up where something $refs it.
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        A key from `POST /me/api-keys`, for machine clients. It acts as its
        owner - same permissions, same ownership checks - and is rate limited
        per key rather than per IP.

        Keys cannot manage keys: creating, listing and revoking need a session,
        so a leaked key cannot mint a replacement and survive its own
        revocation.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT # documentation only; no tool verifies the format
      description: |
        Access token issued by signup or login. Expired and missing tokens are
        both answered with 401.

  schemas:
    # Matches handler.errorResponse exactly: Error string `json:"error"`,
    # Details map[string]string `json:"details,omitempty"`.
    Error:
      type: object
      required: [error] # "details" is omitempty in Go, so it is not required
      properties:
        error:
          type: string
          description: |
            Safe to show a user on 4xx, and written for display: sentence case,
            no trailing full stop. Render it as-is rather than transforming it.
            On 5xx this is always "Something went wrong" — the cause is in the
            server log, tagged with the `X-Request-ID` on the response.
          examples: ["Listing not found"]
        details:
          type: object
          # "any key, string value" - the YAML spelling of map[string]string.
          additionalProperties:
            type: string
          description: Reserved for field-level validation errors; absent today.

    ListingImage:
      type: object
      required: [id, url, position]
      properties:
        id:
          type: string
          format: uuid
          examples: ["01a02305-b81c-7dcb-86a0-7f75e33e0af3"]
        url:
          type: string
          description: Path served by the API, e.g. for use in an `img` tag.
          examples: ["/uploads/0a7a0bc6-99f9-42f8-9ba0-c908a9cb3a93.png"]
        position:
          type: integer
          format: int32
          description: Display order, ascending. Unique per listing.
          examples: [0]

    Avatar:
      type: object
      required: [avatar_url]
      properties:
        avatar_url:
          type: string
          description: Path served by the API, for use in an `img` tag.
          examples: ["/uploads/0a7a0bc6-99f9-42f8-9ba0-c908a9cb3a93.png"]

    Category:
      type: object
      required: [slug, name, children]
      description: |
        The tree is capped at two levels by the database, so a child never has
        children of its own - `children` on a child is always `[]`.

        It is always present rather than omitted when empty, so a client never
        has to distinguish "no children" from "field absent".
      properties:
        slug:
          type: string
          description: |
            The stable identifier. This is what `Listing.category` holds and
            what `?category=` takes - never the name.
          examples: ["mushrooms"]
        name:
          type: string
          description: For display. Renaming it does not break a saved URL.
          examples: ["Mushrooms"]
        children:
          type: array
          items:
            $ref: "#/components/schemas/Category"

    Listing:
      type: object
      # Every field without omitempty in ListingResponse is always present.
      required:
        [
          id,
          seller_id,
          title,
          description,
          category,
          price,
          quantity,
          unit,
          created_at,
          updated_at,
          images,
          tags,
          seller,
        ]
      properties:
        id:
          type: string
          format: uuid
          examples: ["01a02305-b81c-7dcb-86a0-7f75e33e0af3"]
        seller_id:
          type: string
          format: uuid # Go uuid.UUID marshals to a string
        title:
          type: string
          maxLength: 100
          examples: ["Golden Chanterelles"]
        description:
          type: string
          description: Empty string when the seller left it blank.
        category:
          type: string
          description: |
            A slug from `GET /categories`, not free text. Previously any string
            was accepted; it is now a foreign key, so only known slugs exist.
          examples: ["mushrooms"]
        price:
          type: number
          format: double
          description: Price per unit. Stored as NUMERIC(10,2).
          examples: [18.5]
        quantity:
          type: integer
          format: int32
          description: Remaining quantity; 0 means sold out.
          examples: [4]
        unit:
          type: string
          examples: ["kg"]
        created_at:
          type: string
          format: date-time # Go time.Time marshals to RFC 3339
        updated_at:
          type: string
          format: date-time
        images:
          type: array
          description: Always present; empty when the listing has no photos.
          items:
            # $ref = "reuse that definition here". This is why schemas exist.
            $ref: "#/components/schemas/ListingImage"
        tags:
          type: array
          description: |
            Always present, `[]` when the listing has none - never absent and
            never null, so a client can iterate without a guard.

            Lower case and trimmed, ordered alphabetically.
          items:
            type: string
            maxLength: 30
          examples: [["chanterelle", "roadside"]]
        removed_at:
          type: string
          format: date-time
          description: |
            When a moderator removed this listing. **Absent** unless it was
            removed *and* you are its seller or an admin — for everyone else a
            removed listing is 404, so the field can never appear.

            `ReportedListing.removed_at` uses the opposite convention on
            purpose: always present, `null` while the listing is visible. Here
            absence is itself the answer — you are not entitled to know — and
            there it could not be, since only admins read that queue.

        seller:
          description: |
            Who posted it, enough to render a card: a name, a face and a
            rating. Always sent - a listing always has a seller, and a failure
            to load one fails the request rather than answering without it, the
            same as the images and tags beside it. Nullable in the schema
            because the Go field is a pointer; a client that meets null has met
            a bug.
          oneOf:
            - type: "null"
            - type: object
              required: [id, username, avatar_url, rating]
              properties:
                id:
                  type: string
                  format: uuid
                username:
                  type: string
                avatar_url:
                  type: [string, "null"]
                  description: Null when none is set; the default is the client's decision.
                  examples: ["/uploads/0a7a0bc6-99f9-42f8-9ba0-c908a9cb3a93.png"]
                rating:
                  $ref: "#/components/schemas/Rating"
                  description: |
                    The seller's rating, the same shape the profile publishes.

                    **Read `count`, not just `average`.** An unrated seller has
                    `{average: 0, count: 0}`, which is indistinguishable from a
                    genuinely bad one if you only look at the average. A client
                    showing a rating should show something else below a
                    threshold of its own choosing rather than rendering 0.
    PaginatedReviews:
      type: object
      required: [items, total, page, limit, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        total:
          type: integer
          format: int64
        page:
          type: integer
        limit:
          type: integer
          description: Clamped to 50.
        total_pages:
          type: integer

    PaginatedListings:
      type: object
      required: [items, total, page, limit, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        total:
          type: integer
          format: int64
          description: Matching listings across all pages.
        page:
          type: integer
          description: Echoes the requested page, even past the last one.
        limit:
          type: integer
          description: Clamped to 50.
        total_pages:
          type: integer

    CreateAPIKey:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
          description: What this key is for. Trimmed; must not be blank.
          examples: ["ci pipeline"]

    APIKey:
      type: object
      required: [id, name, key_prefix, last_used_at, revoked_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key_prefix:
          type: string
          description: The first characters of the key, to tell rows apart.
          examples: ["fk_live_a3f9"]
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: |
            Null until the key is used. Recorded at most once a minute, so it
            is a rough "last seen" rather than a request log.
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time

    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: |
                Shown once and never again. Store it now.
              examples: ["fk_live_a3f9c2..."]

    # --- auth ---------------------------------------------------------------

    SignupRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          maxLength: 50
          description: |
            Counted in characters, not bytes, and after trimming — surrounding
            whitespace is stripped and does not count toward the limit, so a
            padded 50-character name is accepted. Stored as typed; uniqueness
            ignores case, so `Forager` and `forager` are one account.
          examples: ["forager42"]
        email:
          type: string
          format: email
          maxLength: 150
          description: |
            Trimmed, stored as typed, and unique ignoring case.
          examples: ["forager@example.com"]
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: |
            Counted in bytes, not characters — bcrypt's own limit is 72 bytes,
            so a long passphrase with accented characters can be rejected at
            fewer than 72 typed characters. Hashed before storage; never
            returned.

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: |
            Matched ignoring case and surrounding whitespace, so it need not be
            typed the way it was at signup. The password is matched exactly —
            spaces in it are significant.

            **Login is by email only**, deliberately. A username is a display
            name: public, shown to others, and meant to be changeable, so it is
            not a credential. Email is also the recovery channel for password
            reset and the identity OAuth links on, which keeps one identity
            rather than two doors onto the same account.

            The other planned sign-in path is OAuth (#35), not
            username/password.
        password:
          type: string
          format: password
      # The login handler uses DisallowUnknownFields, so an extra key is a 400.
      # Signup does NOT - that asymmetry is real, not a typo here.
      additionalProperties: false

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
      additionalProperties: false

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: The value from the emailed link's `?token=`.
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
      additionalProperties: false

    UserInfo:
      type: object
      required: [id, username, email, role, has_password, providers]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          examples: ["USER"]
        has_password:
          type: boolean
          description: |
            Whether the account can sign in with a password, and therefore
            whether password flows apply to it at all. An account created
            through a provider has none: `/auth/forgot-password` answers 202
            for it like any other address, but mails "reset unavailable"
            instead of a link. Branch on this rather than on `providers` being
            empty — this is the condition the backend itself enforces.
        providers:
          type: array
          description: |
            The OAuth providers linked to this account, for display — "You sign
            in with Google". Empty for a password-only account. Never sent on
            another user's profile: knowing an address belongs to a Google
            account tells an attacker what to forge.
          items:
            type: string
            examples: ["google"]

    AuthResponse:
      type: object
      required: [access_token, user]
      properties:
        access_token:
          type: string
          description: |
            Send as `Authorization: Bearer <access_token>`. The refresh token
            is NOT in the body — it comes back as an HttpOnly cookie.
        user:
          $ref: "#/components/schemas/UserInfo"

    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        checks:
          type: object
          additionalProperties:
            type: string
          examples: [{ "database": "healthy" }]

    # --- listings & orders (authenticated) -----------------------------------

    ListingInput:
      type: object
      # Create and update take the identical body, so they share this schema.
      # PUT is a full replace: every field is required on both.
      required: [title, category, price, quantity, unit]
      properties:
        title:
          type: string
          maxLength: 100
          description: |
            The server counts BYTES, so accented characters use up more than
            one of the 100.
          examples: ["Golden Chanterelles"]
        description:
          type: string
          description: The only optional field.
        category:
          type: string
          maxLength: 50
          description: |
            Must be a slug from `GET /categories`. Trimmed and lower-cased on
            the way in - the same normalisation migration 013 applied to the
            rows it found - so `Mushrooms` is stored as `mushrooms` rather than
            rejected. An unrecognised value is still a 400, where it used to be
            accepted and stored as-is.
          examples: ["mushrooms"]
        price:
          type: number
          format: double
          exclusiveMinimum: 0 # "price must be greater than 0"
          examples: [18.5]
        quantity:
          type: integer
          format: int32
          exclusiveMinimum: 0
          examples: [4]
        unit:
          type: string
          maxLength: 20
          examples: ["kg"]
        tags:
          type: array
          maxItems: 5
          description: |
            Normalised on write: trimmed, lower-cased, and de-duplicated. So
            `["Chanterelle", "chanterelle"]` is stored as one tag rather than
            rejected as a conflict, and blank entries are dropped rather than
            refused - a form with five slots and two filled is not an error.

            The limit of 5 applies **after** de-duplication, so six entries that
            collapse to four are accepted.

            **`PUT /listings/{id}` replaces the whole set.** Omitting `tags`
            removes every tag the listing had; it does not leave them alone.
          items:
            type: string
            maxLength: 30
          examples: [["chanterelle", "roadside"]]

    CreateOrderInput:
      type: object
      required: [listing_id, quantity]
      properties:
        listing_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
          exclusiveMinimum: 0

    Order:
      type: object
      required:
        [
          id,
          listing_id,
          listing_title,
          buyer_id,
          seller_id,
          quantity,
          unit_price,
          total_price,
          status,
          seller_handed_over_at,
          buyer_received_at,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
        listing_title:
          type: string
          description: |
            Snapshotted when the order was placed, so the order still reads
            correctly after the listing is edited.
        buyer_id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        quantity:
          type: integer
          format: int32
        unit_price:
          type: number
          format: double
          description: |
            Price per unit, snapshotted when the order was placed, so the order
            still reads correctly after the listing is repriced.

            Stored as `NUMERIC(10,2)` and converted only on the way out —
            `total_price` is multiplied by Postgres in exact decimal, never in
            Go. Trailing zeroes are not preserved: 18.50 is sent as 18.5, and
            74.00 as 74. Format for display client-side.
          examples: [18.5]
        total_price:
          type: number
          format: double
          description: unit_price × quantity, computed in the database.
          examples: [74]
        status:
          $ref: "#/components/schemas/OrderStatus"
        seller_handed_over_at:
          # "null OR a timestamp" - the Go field is *time.Time.
          type: [string, "null"]
          format: date-time
          description: Set when the seller marked handover; null until then.
        buyer_received_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrderStatus:
      type: string
      description: |
        The lifecycle: `pending` → `confirmed` → `completed`, or `cancelled`
        from either of the first two.

        `completed` needs BOTH sides: the seller calls `/handover` and the
        buyer calls `/receive`. Whichever comes first only stamps its own
        timestamp and leaves the status at `confirmed`.

        **That creates a state neither party can leave.** Once either timestamp
        is set, `/cancel` is refused, and the status only moves when the *other*
        party acts. If they never do, the order is stuck in `confirmed` for
        good. After seven days an admin can end it with
        `POST /admin/orders/{id}/resolve`.

        A second state is just as unreachable, for a different reason.
        `/cancel` accepts *either* party, so losing one is survivable — but if
        both the buyer and the seller delete their accounts while the order is
        still `pending`, or `confirmed` with neither timestamp set, nobody is
        left who may call it. There is no waiting period here: seven days exist
        to give a real person time to act, and nothing happened for anyone to
        finish. An admin can resolve it immediately, and only as `cancelled`.

        Note the two shapes are told apart by the handshake timestamps, not by
        who still has an account. An order that was handed over and *then*
        abandoned by both parties is the first shape, not this one: it waits the
        seven days and accepts any outcome.

        Both shapes are what `stuck` means on `AdminOrder`, and both end the
        same way — by an admin, never automatically. Deleting an account does
        not unwind orders.

        `refunded` exists for that resolution: it means the trade got far enough
        that calling it `cancelled` would be false. No money moves - none ever
        did - but the status is the record, and the record should not lie.

        An earlier schema had a `paid` status; migration 007 removed it.
      enum: [pending, confirmed, completed, cancelled, refunded]

    AdminOrder:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [stuck]
          properties:
            stuck:
              type: boolean
              description: |
                True when no party can move this order, which is exactly what
                `/resolve` accepts. Two shapes qualify: `confirmed` with exactly
                one handshake timestamp set and that timestamp more than seven
                days old, or `pending`/`confirmed` with neither timestamp set
                and both the buyer and the seller deleted.

                Derived, never stored - so it cannot drift from the columns and
                accounts it summarises.

    PaginatedAdminOrders:
      type: object
      required: [items, total, page, limit, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminOrder"
        total:
          type: integer
          format: int64
        page:
          type: integer
        limit:
          type: integer
          description: Clamped to 50.
        total_pages:
          type: integer

    ResolveOrderRequest:
      type: object
      required: [outcome, reason]
      properties:
        outcome:
          type: string
          enum: [completed, cancelled, refunded]
          description: |
            `completed` says the trade happened after all. `cancelled` says it
            did not. `refunded` says it did and was undone - the honest answer
            when one party has already handed over.

            The two that end without a trade return the quantity to the
            listing's stock; `completed` does not.
        reason:
          type: string
          maxLength: 500
          description: |
            Required. It lands in the order's event history as the note, so it
            is the only record of why an admin overrode a stuck order.

            **Write it for the buyer and the seller to read.** They both fetch
            that history from `GET /orders/{id}/events`, which returns the note
            and the `actor_id` alongside it - the same principle as a suspension
            reason, which the suspended user is shown deliberately.

    # --- chat & settings ------------------------------------------------------

    StartConversationInput:
      type: object
      required: [listing_id, body]
      properties:
        listing_id:
          type: string
          format: uuid
        body:
          type: string
          maxLength: 2000
          description: |
            The opening message. Trimmed of surrounding whitespace; a body
            that is empty after trimming is a 400.

    SendMessageInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 2000

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          description: |
            The password you sign in with now. Required even though you are
            already signed in: the session proves you were authenticated at
            some point, not that the person at the keyboard owns the account.
            An unattended laptop is a valid session.
        new_password:
          type: string
          minLength: 8
          maxLength: 72
          description: |
            Same rules as signup. 72 bytes is bcrypt's limit, not a preference -
            it silently ignores anything beyond that, so a longer password
            would not be the password you think it is.

    DeleteAccountRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          description: |
            Your own username, typed exactly. Re-entering a password is the
            usual guard, but accounts created through Google or GitHub have
            none, so it would need a second flow for them. Typing your name
            works the same either way.
      additionalProperties: false

    Rating:
      type: object
      required: [average, count]
      description: |
        Computed from the reviews on every read rather than stored on the
        seller. A denormalised average has to be updated by every write path,
        and the first one that forgets leaves a number that disagrees with the
        reviews it claims to summarise.
      properties:
        average:
          type: number
          format: double
          description: Rounded to one decimal. 0 when there are no reviews.
          examples: [4.3]
        count:
          type: integer
          format: int64

    ReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
          description: |
            Optional free text. Shown to other buyers as plain text — control
            characters are stripped at write time, never at render time.
      additionalProperties: false

    Review:
      type: object
      required: [id, order_id, rating, comment, reviewer, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        rating:
          type: integer
          examples: [5]
        comment:
          type: string
          description: Empty string when the reviewer left none.
        reviewer:
          type: string
          description: |
            "Deleted user" once that account is gone. The review itself
            survives — what a buyer said about a seller is a fact about the
            seller, so it does not leave with its author.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Differs from `created_at` when the review was edited.

    ReorderImagesRequest:
      type: object
      required: [image_ids]
      properties:
        image_ids:
          type: array
          description: |
            Every image on the listing, once each, in the order you want them.
            The first becomes the cover photo.
          items:
            type: string
            format: uuid
      additionalProperties: false

    ReportListingRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [spam, prohibited, misleading, offensive, other]
        detail:
          type: string
          maxLength: 500
          description: |
            Free text, and the only place to say what `other` means. Shown to a
            moderator as plain text — never rendered as HTML.

            **Required when `reason` is `other`**, and whitespace does not
            count: every other reason states the problem by itself, while
            `other` says only that none of them fit, which is nothing to act
            on.
      additionalProperties: false

    ModerateListingRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [remove, restore, dismiss]
          description: |
            `remove` hides the listing and marks its open reports `upheld`.
            `dismiss` leaves the listing alone and marks them `dismissed`.
            `restore` puts a removed listing back.

            There is no `escalate`: every moderator holds the same ADMIN role,
            so it would move a report from one queue to the same queue.
        note:
          type: string
          maxLength: 500
          description: |
            Why. **Required for `remove`** — an audit trail whose reason is
            empty is only a timestamp. Optional for the other two.
      additionalProperties: false

    ModerateListingResponse:
      type: object
      required: [listing, reports_resolved]
      properties:
        listing:
          $ref: "#/components/schemas/Listing"
        reports_resolved:
          type: integer
          format: int64
          description: |
            How many open reports this one action closed. Moderators act on a
            listing, not on a report, so three complaints about one listing are
            resolved together. Zero means it was acted on with nothing pending.

    ReportedListing:
      type: object
      required: [listing_id, title, seller_id, removed_at, report_count, first_reported_at]
      description: |
        One row of the queue: a listing with at least one open report, oldest
        complaint first.
      properties:
        listing_id:
          type: string
          format: uuid
        title:
          type: string
        seller_id:
          type: string
          format: uuid
        removed_at:
          type: string
          format: date-time
          nullable: true
          description: |
            When a moderator removed this listing. Always present — `null` while
            it is still visible.

            `Listing.removed_at` uses the opposite convention on purpose: absent
            rather than `null` when there is nothing to report, because there the
            field's absence means the reader may not be told. This queue is
            admin-only, so there is nothing to withhold and the field always
            carries a value.
        report_count:
          type: integer
          format: int64
        first_reported_at:
          type: string
          format: date-time

    Report:
      type: object
      required: [id, reporter_id, reason, detail, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        reporter_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Null once the reporter deletes their account — the report survives
            them, since the complaint is about the listing, not the person.
        reason:
          type: string
          enum: [spam, prohibited, misleading, offensive, other]
        detail:
          type: string
          description: |
            Attacker-controlled text, stripped of control characters at write
            time. Render it as plain text.

            Always present, empty when the reporter gave no detail - the field
            is serialised unconditionally, so a client must not test for its
            absence.
        status:
          type: string
          enum: [open, upheld, dismissed]
        created_at:
          type: string
          format: date-time

    ModerationAction:
      type: object
      required: [id, listing_id, moderator_id, action, note, created_at]
      description: One entry in the audit trail. Nothing here is ever edited.
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
        moderator_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Null once that admin's account is deleted. The record outlives
            them deliberately — an audit row that vanishes with its author is
            not an audit row.
        action:
          type: string
          enum: [removed, restored, dismissed]
          description: Past tense, because the log records what was done.
        note:
          type: string
          description: |
            Why. Always present, empty where the action carried no note - the
            field is serialised unconditionally, so a client must not test for
            its absence.
        created_at:
          type: string
          format: date-time

    AdminUser:
      type: object
      required: [id, username, email, role, status, created_at]
      description: |
        An account as an admin sees it. This is the only representation in the
        API that carries `email`, and the only one that shows deleted accounts
        at all - the route sits behind RequireRole(ADMIN), which is what
        justifies both.
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          description: |
            `deleted-<id>` once the account is deleted. The row is anonymised
            rather than removed, so nothing here identifies the person who
            left; a client displays "Deleted user".
        email:
          type: string
          description: Becomes `deleted-<id>@deleted.invalid` on deletion.
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [active, suspended, deleted]
          description: |
            Derived at the response boundary, not stored. `deleted` wins over
            `suspended`, because a deleted account is gone whatever it was
            before.
        suspension_reason:
          type: string
          description: |
            Present while the account is suspended. It also survives on an
            account that was deleted while suspended - the reason it was
            actioned is context an admin still wants.
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: |
            Absent if they have never been seen, and once the account is
            deleted. Unlike every other view this ignores the user's
            `show_online_status` setting - it is a moderation signal for
            spotting dormant or newly active accounts, not a presence
            indicator to show anyone.

    PaginatedAdminUsers:
      type: object
      required: [items, total, page, limit, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
          format: int64
          description: Matching accounts across all pages.
        page:
          type: integer
          description: Echoes the requested page, even past the last one.
        limit:
          type: integer
          description: Clamped to 50.
        total_pages:
          type: integer

    UserAction:
      type: object
      required: [id, action, note, moderator_id, created_at]
      description: One entry in an account's audit trail. Append-only.
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          enum: [suspended, reinstated, deleted]
          description: Past tense, because the log records what was done.
        note:
          type: string
          description: |
            The reason given. Empty only for a reinstatement, which is the one
            action that does not require one.
        moderator_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Null once that admin's own account is deleted. The record outlives
            them deliberately.
        created_at:
          type: string
          format: date-time

    SuspendRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 500
          description: |
            Shown to the suspended user on their next request, so write it for
            them to read. Required - a suspension with no stated cause is not
            one anybody can appeal.
          examples: ["Repeatedly listing items they do not have"]

    SetRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [USER, ADMIN]
          description: |
            The role the account should end up with, not a direction. Sending
            the role it already has is a no-op: 200 with the account unchanged
            and nothing written to its history, because a promotion that did
            not happen has no business in the audit trail.
        note:
          type: string
          maxLength: 500
          description: |
            Optional, unlike a suspension's reason. A role change is not a
            sanction.

    ReinstateRequest:
      type: object
      description: |
        The note is optional here, unlike everywhere else: "this was a
        mistake" needs no justification the way a punishment does.
      properties:
        note:
          type: string
          maxLength: 500

    AdminDeleteRequest:
      type: object
      required: [username, reason]
      properties:
        username:
          type: string
          description: |
            The target's exact username, as confirmation. The same guard the
            user's own DELETE /me uses - an admin deleting the wrong account
            cannot undo it.
        reason:
          type: string
          maxLength: 500

    Presence:
      type: object
      required: [is_online]
      description: |
        `is_online` means "seen within the last 2 minutes" (twice the
        heartbeat interval, so one missed beat is not read as offline).

        `last_seen_at` is absent when the other user has switched online
        status off, and also when they have never been seen. An offline user
        who has NOT hidden their status still sends `last_seen_at`, so an
        absent timestamp does not by itself mean "offline".

        Presence also goes dark when **either** of you has blocked the other,
        and it is never sent to an unauthenticated caller. Do not render an
        absent `last_seen_at` as "this user hid their status" - it is
        deliberately indistinguishable from a block, because telling someone
        they have been blocked is the one thing blocking must not do.
      properties:
        is_online:
          type: boolean
        last_seen_at:
          # OMITTED, not null, when unknown or hidden - the Go tag is omitempty.
          type: string
          format: date-time

    ChatUser:
      type: object
      required: [id, username, avatar_url, presence]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        avatar_url:
          type: [string, "null"]
          description: |
            Path served by the API, or `null` when none is set. The default
            avatar is the client's decision, not a URL the API invents.

            Also `null` for a deleted account, whose `username` is already
            anonymised — an avatar left in place would identify the person the
            anonymisation exists to hide.
          examples: ["/uploads/0a7a0bc6-99f9-42f8-9ba0-c908a9cb3a93.png"]
        presence:
          $ref: "#/components/schemas/Presence"

    Notification:
      type: object
      description: |
        Something that happened to you. `kind` and the ids say what and where;
        the sentence is the client's to write.
      required:
        [id, kind, listing_title, order_id, conversation_id, actor_id,
         listing_id, read_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: |
            **Exactly one of the four subject ids is set**, and which one
            depends on the kind rather than on what happens to be non-null.
            Route on `kind`; a kind you do not recognise should render as plain
            text rather than being guessed at from the ids.
          enum:
            [
              order_placed,
              order_handed_over,
              order_cancelled,
              order_resolved,
              order_confirmed,
              order_completed,
              chat_request,
              review_received,
              new_follower,
              listing_removed,
              saved_listing_gone,
              saved_listing_deleted,
            ]
        listing_title:
          type: [string, "null"]
          description: |
            Snapshotted when the notification was written, like the one on an
            order: the listing can be removed and this still has to read
            sensibly.

            **Null for a kind with no listing.** Always present, so a client
            tests for null rather than for a missing key.
        order_id:
          type: [string, "null"]
          format: uuid
          description: Set for the six order kinds.
        conversation_id:
          type: [string, "null"]
          format: uuid
          description: Set for `chat_request`.
        actor_id:
          type: [string, "null"]
          format: uuid
          description: |
            The person a notification is about, for kinds whose subject is
            neither an order nor a conversation: `new_follower` (whoever
            followed you), `review_received` and `saved_listing_deleted` (you
            and the seller respectively - it is what the row points *at*, not
            always who acted).
        listing_id:
          type: [string, "null"]
          format: uuid
          description: |
            The listing a notification is about: `listing_removed` and
            `saved_listing_gone`. Not `saved_listing_deleted` - that listing no
            longer exists, so the row points at its seller instead.
        read_at:
          type: [string, "null"]
          format: date-time
          description: Null until you mark your notifications read.
        created_at:
          type: string
          format: date-time

    BlockedUser:
      type: object
      description: |
        One person you have blocked. Deliberately not `ChatUser` — that carries
        `presence`, and whether someone you blocked is online is exactly what
        should stop being visible to you.
      required: [id, username, blocked_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        blocked_at:
          type: [string, "null"]
          format: date-time

    Message:
      type: object
      required: [id, conversation_id, sender_id, body, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Ascending; also the cursor for the `after` parameter.
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        body:
          type: string
        read_at:
          # Absent while unread. Contrast Order, whose timestamps are null.
          type: string
          format: date-time
          description: Absent until the recipient marks the conversation read.
        created_at:
          type: string
          format: date-time

    MessagePreview:
      type: object
      required: [body, created_at]
      properties:
        body:
          type: string
        created_at:
          type: string
          format: date-time

    ConversationStatus:
      type: string
      description: |
        `pending` until the seller answers. The buyer's opening message is
        already stored, but neither side can send another until it is
        `accepted`; `declined` closes it for good.
      enum: [pending, accepted, declined]

    ConversationRole:
      type: string
      description: Your side of THIS conversation, not a site-wide role.
      enum: [buyer, seller]

    Conversation:
      type: object
      required:
        [
          id,
          listing_id,
          listing_title,
          status,
          role,
          other_user,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          # Nullable: the FK is ON DELETE SET NULL, so a deleted listing leaves
          # the conversation intact with listing_id null.
          type: [string, "null"]
          format: uuid
        listing_title:
          type: string
          description: |
            Snapshotted when the chat started, so the thread still says what
            it was about after the listing is edited or deleted.
        status:
          $ref: "#/components/schemas/ConversationStatus"
        role:
          $ref: "#/components/schemas/ConversationRole"
        other_user:
          $ref: "#/components/schemas/ChatUser"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConversationListItem:
      type: object
      # The list shape is NOT the detail shape: it swaps created_at for a
      # preview and an unread count, which the list view needs and the
      # detail view does not.
      required:
        [
          id,
          listing_id,
          listing_title,
          status,
          role,
          other_user,
          last_message,
          unread_count,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          type: [string, "null"]
          format: uuid
        listing_title:
          type: string
        status:
          $ref: "#/components/schemas/ConversationStatus"
        role:
          $ref: "#/components/schemas/ConversationRole"
        other_user:
          $ref: "#/components/schemas/ChatUser"
        last_message:
          # Null, not absent - no omitempty on this one.
          oneOf:
            - $ref: "#/components/schemas/MessagePreview"
            - type: "null"
          description: Null on a conversation with no messages.
        unread_count:
          type: integer
          format: int64
          description: Unread messages from the other user in this thread.
        updated_at:
          type: string
          format: date-time

    UnreadCount:
      type: object
      required: [unread_count]
      properties:
        unread_count:
          type: integer
          format: int64

    UserSettings:
      type: object
      required: [show_online_status]
      properties:
        show_online_status:
          type: boolean

    UpdateSettingsInput:
      type: object
      # Required because the Go field is a *bool specifically to tell
      # "false" apart from "not sent" - and "not sent" is a 400.
      required: [show_online_status]
      properties:
        show_online_status:
          type: boolean

    OrderEvent:
      type: object
      description: |
        One entry in an order's history, written in the same transaction as the
        change it describes - so a refused transition leaves no entry, and an
        entry cannot describe something that did not happen.
      required: [id, order_id, actor_id, from_status, to_status, note, created_at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        actor_id:
          type: [string, "null"]
          format: uuid
          description: |
            Who acted. Null once that account is deleted: the event outlives
            the person, unlike a follow or a session.
        from_status:
          # Deliberately NOT the OrderStatus enum: these are historical values.
          # Migration 007 removed 'paid' from the allowed set, and rows written
          # before that still say it.
          type: [string, "null"]
          description: |
            The status before the change, or null for the event recording the
            order being placed. A plain string rather than the `OrderStatus`
            enum, because old rows may hold statuses no longer in use.
          examples: ["confirmed"]
        to_status:
          type: string
          description: |
            The status after the change. Equal to `from_status` on a handshake
            mark, where a party acted but the order did not move.
          examples: ["completed"]
        note:
          type: [string, "null"]
          description: |
            Why the event happened, when the statuses alone cannot say. Two
            things write it:

            - **Handshake marks**, where `from_status` equals `to_status` and
              only the note says who acted. These are stable codes, not display
              text - `seller_handover` or `buyer_receipt` - so a client renders
              them in its own language. Rows already written cannot be
              re-translated.
            - **An admin resolution**, which stores the reason the admin typed.
              That is prose, in whatever language they wrote it, and it appears
              on an ordinary transition where `from_status` differs from
              `to_status`.

            Null otherwise.
          examples: ["seller_handover"]
        created_at:
          type: string
          format: date-time

    # --- profiles --------------------------------------------------------------

    ProfileUpdate:
      type: object
      description: |
        Every field is optional and each accepts three states, so a PATCH can
        say "leave this alone", "clear it", or "set it" per field:

        | Sent | Effect |
        |---|---|
        | key absent | keep the current value |
        | `null` **or** `""` | clear the field to `null` |
        | a value | replace it (surrounding whitespace is trimmed) |

        Note `null` and `""` behave the same. RFC 7396 merge-patch would treat
        `""` as a value; this API treats an empty string as "clear", because a
        form that submits a cleared input sends `""` rather than `null`.

        Unknown fields are rejected with a 400 - with every field optional, a
        typo is otherwise indistinguishable from an omission.
      additionalProperties: false
      properties:
        firstname:
          type: [string, "null"]
          maxLength: 150
        lastname:
          type: [string, "null"]
          maxLength: 150
        bio:
          type: [string, "null"]
          maxLength: 1000
        phone_number:
          type: [string, "null"]
          maxLength: 15
        date_of_birth:
          type: [string, "null"]
          format: date
          description: |
            `YYYY-MM-DD`. Rejected if it is not a plain date, is in the future,
            or falls before 1900.
          examples: ["2001-05-14"]
        location:
          type: [string, "null"]
          maxLength: 100
          description: |
            Free text, stored on the user's address rather than the profile.
            This is what the `location` filter on `/listings/search` matches.
          examples: ["Espoo"]

    DataExport:
      type: object
      description: |
        Everything the API tells an account about itself, in one document. Each
        field is the same shape the endpoint that serves it publishes, so this
        cannot drift into describing something the API does not send.
      required:
        [exported_at, account, oauth_providers, listings, orders,
         saved_listings, conversations, messages, reviews_written,
         reviews_received, following, followers, blocks, notifications,
         api_keys]
      properties:
        exported_at:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/OwnProfile"
        oauth_providers:
          type: array
          items: { type: string }
        listings:
          type: array
          description: |
            Everything this account posted, including sold-out and
            moderator-removed listings - their own record of what they wrote,
            not a shop window.
          items:
            $ref: "#/components/schemas/Listing"
        orders:
          type: array
          description: Both sides - what they bought and what they sold.
          items:
            $ref: "#/components/schemas/Order"
        saved_listings:
          type: array
          items:
            $ref: "#/components/schemas/Listing"
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationListItem"
        messages:
          type: array
          description: |
            Both sides of every conversation. The other person's text is
            already readable in the app, so this discloses nothing new - and
            half a conversation would be worse than none.
          items:
            $ref: "#/components/schemas/Message"
        reviews_written:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        reviews_received:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        following:
          type: array
          items:
            $ref: "#/components/schemas/ChatUser"
        followers:
          type: array
          items:
            $ref: "#/components/schemas/ChatUser"
        blocks:
          type: array
          description: |
            Who this account has blocked. Who has blocked THEM is absent, and
            deliberately so.
          items:
            $ref: "#/components/schemas/BlockedUser"
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        api_keys:
          type: array
          description: Metadata only - a key's secret is never stored.
          items:
            $ref: "#/components/schemas/APIKey"
    OwnProfile:
      type: object
      description: |
        Your own profile. Unset fields are `null` rather than absent, so a form
        can render an empty input without deciding whether the key exists.
      required:
        [id, username, email, firstname, lastname, bio, phone_number, date_of_birth, location, avatar_url]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        firstname:
          type: [string, "null"]
        lastname:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        phone_number:
          type: [string, "null"]
        date_of_birth:
          type: [string, "null"]
          format: date
          examples: ["2001-05-14"]
        location:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
          description: |
            Path served by the API, or `null` when none is set. The default
            avatar is the client's decision, not a URL the API invents.
          examples: ["/uploads/0a7a0bc6-99f9-42f8-9ba0-c908a9cb3a93.png"]

    PublicProfile:
      type: object
      description: |
        Somebody else's profile. `email`, `phone_number` and `date_of_birth`
        are not blanked here - the shape has no such fields, so they cannot be
        exposed by an oversight.
      # presence is NOT required: it is omitted entirely for an unauthenticated
      # caller. See the property's description.
      required: [id, username, firstname, lastname, bio, location, avatar_url, rating]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        firstname:
          type: [string, "null"]
        lastname:
          type: [string, "null"]
        bio:
          type: [string, "null"]
        location:
          type: [string, "null"]
        avatar_url:
          type: [string, "null"]
          description: |
            Path served by the API, or `null` when none is set. The default
            avatar is the client's decision, not a URL the API invents.
          examples: ["/uploads/0a7a0bc6-99f9-42f8-9ba0-c908a9cb3a93.png"]
        rating:
          allOf:
            - $ref: "#/components/schemas/Rating"
          description: |
            Always present. A seller with no reviews has
            `{"average": 0, "count": 0}` — `count` is what separates "not rated
            yet" from "rated zero", so a client never has to treat an absent
            object as a third case.
        presence:
          allOf:
            - $ref: "#/components/schemas/Presence"
          description: |
            **Absent entirely for an unauthenticated caller.** Presence needs a
            token; the rest of the profile does not.

            It is omitted rather than sent as `{"is_online": false}` because a
            blanket false is indistinguishable from a real one — a client would
            render "Offline" on every profile on the site and be wrong about
            all of them. An absent field says "you are not signed in", which
            the caller already knows, and reveals nothing about the subject.

            For a signed-in caller it is always present, and reads offline when
            the subject hid their status **or** when either of you has blocked
            the other. That ambiguity is deliberate.

  # Whole reusable responses, not just schemas - status code descriptions we
  # would otherwise retype on all 35 operations.
  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json: # the media type the body is sent as
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        No token, or one that is expired or invalid. The body is the same in
        every case; `WWW-Authenticate` says which, because a client's response
        differs: refresh, or log in.
      headers:
        WWW-Authenticate:
          description: |
            `Bearer error="invalid_token", error_description="The access token expired"`
            when the token was valid but has aged out - retry through
            `POST /auth/refresh`. A bare `Bearer` for a missing, malformed or
            forged token - the client should log in. A forged token reads as
            absent on purpose.
          schema:
            type: string
          examples:
            expired:
              value: Bearer error="invalid_token", error_description="The access token expired"
            absent:
              value: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        Authenticated, but not permitted — the resource belongs to someone
        else, or the account does not hold the role the route requires.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: |
        No such resource — also returned when a resource exists but the caller
        is not a participant, so its existence is not revealed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: |
        The request body was larger than the server accepts. Enforced by
        middleware on the whole API rather than by each endpoint, so any
        request with a body can answer this — the cap is `MAX_UPLOAD_BYTES`
        plus a megabyte of headroom, which no ordinary request approaches.

        A declared `Content-Length` over the cap is refused before the body is
        read at all. A body sent without one is stopped mid-read instead, and
        the endpoint reports that as a 400.

        The upload endpoints have their own, smaller cap and their own message
        naming the image; theirs is the limit a real client meets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: |
        Too many requests on this API key. Only key-authenticated requests are
        limited; browser sessions are not.
      headers:
        Retry-After:
          description: Seconds until a request will be accepted again.
          schema:
            type: integer
            examples: [2]
        X-RateLimit-Limit:
          description: |
            The bucket's capacity. Sent on every key-authenticated response,
            not only on a refusal.
          schema:
            type: integer
            examples: [60]
        X-RateLimit-Remaining:
          description: Requests left in the current bucket.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Something failed on our side; the cause is in the log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

# Each key is a URL relative to the server above, so "/listings" is really
# http://localhost:8080/api/v1/listings.
paths:
  # ---------------------------------------------------------------------------
  # auth
  # ---------------------------------------------------------------------------
  /auth/signup:
    post: # the HTTP method is the second level: path -> method -> operation
      tags: [auth] # which section of the UI this lands in
      summary: Create an account
      operationId: signup # unique id; client generators use it as the func name
      # Overrides the document-wide default: no token needed (you have none yet).
      security: []
      description: |
        Creates the user and their empty profile in one transaction, then
        returns an access token. The refresh token is set as an HttpOnly
        `refresh_token` cookie rather than returned in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        # Status codes are quoted - unquoted YAML would read them as numbers.
        "201":
          description: Account created.
          headers:
            Set-Cookie:
              description: HttpOnly `refresh_token`, valid for 7 days.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: |
            That email or username is already taken. Both are unique **ignoring
            case and surrounding whitespace** — `Forager`, `forager` and
            ` forager ` are the same account — and the message says which
            clashed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated.
          headers:
            Set-Cookie:
              description: HttpOnly `refresh_token`, valid for 7 days.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            Wrong password, or no such account. Deliberately the same message
            either way, so this cannot be used to discover which emails exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The account is suspended, and the message names the reason so the
            user knows what to appeal.

            Checked *after* the password comparison, so a wrong password on a
            suspended account is still the 401 above - the state of an account
            is never revealed to someone who cannot get into it. A deleted
            account is a 401 too, since it no longer exists to have a state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Ask for a password reset link
      operationId: forgotPassword
      security: []
      description: |
        **Always 202**, whether or not an account exists for that address.
        Reporting "no such account" would let anyone test an address list and
        learn who is registered, so the response is deliberately uninformative
        — a typo looks exactly like success.

        A new link supersedes any earlier one, so asking twice leaves one
        working key rather than two. Requests inside a short cooldown are
        silently ignored, which is also indistinguishable from success: this
        endpoint is unauthenticated and sends mail, so without a cooldown it is
        a way to make this server send email on someone else's behalf.

        The link expires in an hour and works once.

        **An account that signs in with Google or GitHub has no password, and
        this will not create one.** That address gets an email naming the
        provider instead of a link. A reset cannot mint a credential for an
        account that never had one: GitHub hands over a verified address that
        may live at any mailbox, so a password would drop the account to the
        weaker of mailbox and provider and walk past the provider's 2FA.

        The response, the timing and the cooldown are identical either way —
        only the words in the email differ, and only the mailbox owner reads
        them. Adding a password to a provider account is an authenticated
        action, not something an unauthenticated endpoint can do.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "202":
          description: |
            Accepted. This says nothing about whether an account exists, or
            whether an email was in fact sent.
        "400":
          description: |
            Bad body, an unknown field, or an empty email. This distinguishes
            malformed input from everything else — never whether an address is
            registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/reset-password:
    post:
      tags: [auth]
      summary: Set a new password from a reset link
      operationId: resetPassword
      security: []
      description: |
        Spends the token, sets the password, and revokes **every refresh token
        and every API key** for that user, all in one transaction. Revoking is
        the point rather than a detail: people reset precisely when they think
        someone else has their password. API keys matter especially, because
        they never expire — one created during a compromise would otherwise
        outlive the reset indefinitely.

        **One thing survives**: an access token already issued stays valid until
        it expires, up to `ACCESS_TOKEN_TTL` (15 minutes by default). JWTs are
        verified by signature alone and nothing consults the database, so there
        is no way to revoke one. An attacker holding a live access token keeps
        access for the remainder of that window; they simply cannot renew it.

        No session is returned and no cookie is set. Following the link proves
        control of the mailbox, not of the account, so the next step is
        `POST /auth/login` with the new password.

        Unknown, expired and already-used tokens are one 401 with one message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed and every session ended. No body.
        "400":
          description: |
            Bad body, an unknown field, or a password outside the 8–72 byte
            limits. The limits are bytes, not characters — bcrypt truncates
            past 72.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            The link is unknown, expired or already used — deliberately not
            distinguished, so the endpoint cannot confirm which tokens once
            existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/logout:
    post:
      tags: [auth]
      summary: Clear the refresh token cookie
      operationId: logout
      security: []
      description: |
        Ends **every** session for this account and expires the
        `refresh_token` cookie, so refreshing stops working immediately - it
        does not get the rotation grace window.

        All sessions rather than only the presented one: if that token had
        already been rotated, its successor would otherwise stay live for a
        week while the client was told it had logged out. The cost is that
        logging out on one device logs you out on the others.

        The access token is stateless and cannot be revoked, so it stays valid
        until it expires (up to 15 minutes); the client should drop it too.
        Succeeds even if you were never logged in.
      responses:
        "204":
          description: Cookie cleared. No body.
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange the refresh cookie for a new access token
      operationId: refresh
      security: []
      description: |
        Reads the `refresh_token` cookie - there is no request body, and no
        bearer token is needed, since you are refreshing precisely because the
        access token is gone.

        **The refresh token is rotated.** A new one is set on the cookie and
        the old one is revoked.

        To keep two browser tabs from logging each other out, a just-rotated
        token stays usable for 30 seconds - but it rotates only once. A replay
        inside that window returns a new access token and **no** `Set-Cookie`,
        because the request that won the rotation already put the current token
        in the shared cookie jar. After the window, presenting it again is a
        401.

        The response is the same shape as signup and login, so a client sets
        its session from any of the three with one code path - and recovering
        from a 401 costs one round trip rather than two.
      responses:
        "200":
          description: A new access token, and the identity behind it.
          headers:
            Set-Cookie:
              description: |
                The rotated HttpOnly `refresh_token`, valid for 7 days. Absent
                when this request was a replay inside the grace window and did
                not win the rotation.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: |
            The cookie is missing, unknown, expired, revoked by a logout, or
            rotated more than 30 seconds ago. One answer for all of them: the
            client's move is the same, and distinguishing them would reveal
            which tokens once existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/providers:
    get:
      tags: [auth]
      summary: List the sign-in providers this deployment has configured
      operationId: oauthProviders
      security: []
      description: |
        The names accepted by `/auth/oauth/{provider}`, which is only the ones
        whose client id and secret are set. Empty when none are, and the
        sign-in screen then offers no provider buttons at all.

        Read before a session exists, so it needs none. Always sorted, so the
        buttons do not reorder between page loads.
      responses:
        "200":
          description: The configured providers, alphabetically.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  enum: [google, github]
              examples:
                both:
                  summary: Both configured
                  value: ["github", "google"]
                none:
                  summary: None configured
                  value: []
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/oauth/{provider}:
    get:
      tags: [auth]
      summary: Start signing in with a provider
      operationId: oauthStart
      security: []
      description: |
        A redirect, not an API call — link to it, do not fetch it. Sends the
        browser to the provider's consent screen and sets a short-lived
        HttpOnly `oauth_state` cookie that the callback checks.

        Returns 404 when the provider has no credentials configured for this
        deployment. `GET /auth/providers` is how a client knows that in
        advance, so a build with no Google client id simply has no Google
        button.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
      responses:
        "302":
          description: Redirect to the provider.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: HttpOnly `oauth_state`, valid for 10 minutes.
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      summary: Finish signing in with a provider
      operationId: oauthCallback
      security: []
      description: |
        Where the provider sends the browser back. Never returns JSON on
        failure — the caller is a browser following a redirect, so every
        outcome is a 302 to the frontend's `/auth/callback` carrying either
        `status=ok` or an `error` slug: `access_denied`, `invalid_state`,
        `invalid_request`, `no_email`, `email_in_use`, `already_linked`,
        `retry`, `server_error`.

        `email_in_use` means the address belongs to an account that has a
        password. Signup does not verify addresses, so that account may have
        been registered by someone who does not own this one — linking it
        automatically would be an account takeover. The owner signs in with
        their password instead.

        On success only the `refresh_token` cookie is set — an access token in
        a redirect URL would end up in browser history and proxy logs. The
        frontend calls `POST /auth/refresh` to get one.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
        - name: code
          in: query
          description: The authorization code, exchanged server-side.
          schema:
            type: string
        - name: state
          in: query
          description: Must match the `oauth_state` cookie, or the flow stops.
          schema:
            type: string
        - name: error
          in: query
          description: Set by the provider when the user declined.
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the frontend, signed in or with an error slug.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: HttpOnly `refresh_token`, valid for 7 days, on success.
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /auth/me:
    get:
      tags: [auth]
      summary: Who this session belongs to
      operationId: getCurrentUser
      description: |
        For restoring a session on page load: the access token is still valid,
        only the user object was lost. Refreshing would work too, but it would
        rotate a perfectly good session to answer a question about identity.

        Deliberately not `GET /me/profile`, which is about profile data, is
        assembled from three tables, and carries no `role`.
      responses:
        "200":
          description: The identity behind the token - the same object nested under `user` elsewhere.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The account behind this token no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # categories
  # ---------------------------------------------------------------------------
  /categories:
    get:
      tags: [listings]
      summary: The category tree
      operationId: listCategories
      security: []
      description: |
        Every category, parents with their children nested. Public, because a
        buyer needs the list before they have an account.

        Top-level categories are ordered by slug, and each one's children are
        nested inside it, also ordered by slug. Note that is the slug, not the
        `name` a client displays.

        This is the only source of valid category slugs - creating a listing
        with anything not in this list is a 400.
      responses:
        "200":
          description: The tree. Never empty in practice; the seeded five always exist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # listings (public reads)
  # ---------------------------------------------------------------------------
  /listings:
    post:
      tags: [listings]
      summary: Create a listing
      operationId: createListing
      # No "security" override here: the document default (bearer token)
      # applies, which is exactly what this endpoint needs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "201":
          description: |
            Created. `images` is always `[]` here — upload photos afterwards
            with `POST /listings/{id}/images`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /listings/search:
    get:
      tags: [listings]
      summary: Search, filter, sort and paginate listings
      operationId: searchListings
      security: []
      description: |
        Every parameter is optional; omitting one means "no filter". Sold-out
        listings are excluded, as in `GET /listings`.

        `keyword` and `location` match case-insensitively on a substring, with
        `%` or `_` in the input treated literally rather than as SQL
        wildcards. `category` takes a slug and is exact once trimmed and
        lower-cased, except that a parent slug also matches its children - see
        the parameter below. `tag` is exact too, and normalised the same way.
      parameters:
        # in: query = ?keyword=... . Optional unless "required: true".
        - name: keyword
          in: query
          description: Matches the title or description.
          schema:
            type: string
            maxLength: 200
          examples:
            chanterelle:
              value: chanterelle
        - name: category
          in: query
          description: |
            A slug from `GET /categories`, trimmed and lower-cased like the
            write path, so `?category=Mushrooms` finds them. Filtering by a
            parent returns its children's listings too - `?category=mushrooms`
            includes anything filed under `chanterelles`.

            An unknown slug returns an empty page rather than a 400, unlike
            `sort`: a category is data and can stop existing, and a bookmarked
            URL is better served by no results than by an error.
          schema:
            type: string
            maxLength: 200
          examples:
            mushrooms:
              value: mushrooms
        - name: tag
          in: query
          description: |
            An exact tag, normalised the same way as on write - `?tag=Chanterelle`
            matches a listing tagged `chanterelle`. Not a substring match: `mush`
            does not find `mushroom`.

            One tag only. An unknown tag returns an empty page rather than a 400,
            since tags are user-created and can stop existing.
          schema:
            type: string
            maxLength: 30
          examples:
            chanterelle:
              value: chanterelle
        - name: location
          in: query
          description: |
            Matches the seller's address, not the listing — a listing whose
            seller has no address is never returned by this filter.
          schema:
            type: string
            maxLength: 200
        - name: seller_id
          in: query
          description: |
            Only this seller's listings. A well-formed id nobody owns returns an
            empty page rather than a 404, like `category` and `tag`: a
            bookmarked profile is better served by no results than by an error.
            A malformed one is a 400.

            This is the **public** view of a seller's listings by default,
            because the filter inherits the endpoint's visibility rules rather
            than replacing them: sold-out and moderator-removed listings are
            absent, and a suspended or deleted seller returns nothing at all. A
            seller reading their own inventory can lift the sold-out half of
            that with `include_sold_out`; the other two are not liftable.
          schema:
            type: string
            format: uuid
          examples:
            seller:
              value: 3f1a7c2e-8b4d-4e91-9a5f-2c6d8e0b1a34
        - name: include_sold_out
          in: query
          description: |
            Include listings with nothing left in stock. **Honoured only when
            `seller_id` is the authenticated caller.** A seller's sold-out
            listing is the row they most need to see: it is the one to restock
            or delist, and hiding it is how it silently disappears.

            For anyone else the parameter is **ignored rather than refused** -
            sent with no `seller_id`, by an anonymous caller, or for another
            seller's id, the answer is the ordinary one and there is no error.
            Ignoring is what stops it ever widening public search, whoever sends
            it; a 400 would advertise the parameter and turn a harmless request
            into a failure.

            Only `true` enables it. Any other value, including `1` and `TRUE`,
            reads as absent - the same silence as an unauthorised request.

            It lifts nothing else. A moderator-removed listing stays hidden from
            its own seller, and so do the listings of a suspended one.

            `total` is counted over the same set the page is drawn from, so
            paging stays consistent when it is honoured.
          schema:
            type: boolean
          examples:
            own inventory:
              value: true
        - name: min_price
          in: query
          description: Non-negative. Must not exceed `max_price`.
          schema:
            type: number
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: number
            minimum: 0
        - name: sort
          in: query
          description: Anything outside this list is a 400.
          schema:
            type: string
            # Mirrors the sortOptions map in database/listings_search.go.
            enum: [newest, oldest, price_asc, price_desc, rating_desc]
            default: newest
            description: |
              `rating_desc` orders by the seller's average review score, highest
              first. A seller with no reviews sorts last rather than being
              hidden — the listing still appears, and its `seller.rating.count`
              is what tells a client to show something other than a score.

              The average is raw, so a seller with one five-star review outranks
              one with forty at 4.8. That is what an average is; a client that
              wants to say otherwise has the count to say it with.
        - name: page
          in: query
          description: 1-based. A page past the end returns an empty `items`.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Values above 50 are clamped to 50 rather than rejected.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of matches, plus the totals for a pager.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedListings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /listings/{id}:
    # Declared at path level, so every method on this path inherits it.
    # {id} in the path and "name: id" here have to match exactly.
    parameters:
      - name: id
        in: path
        required: true # path parameters are ALWAYS required
        schema:
          type: string
          format: uuid
    get:
      tags: [listings]
      summary: Get one listing
      operationId: getListing
      security: []
      responses:
        "200":
          description: The listing, with its photos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [listings]
      summary: Replace a listing
      operationId: updateListing
      description: |
        A full replace, not a patch: every required field must be sent, and an
        omitted `description` is stored as empty. Sellers only — and a listing
        whose quantity has reached 0 can no longer be edited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListingInput"
      responses:
        "200":
          description: The updated listing, with its photos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Listing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The listing is sold out; create a new one instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [listings]
      summary: Delete a listing
      operationId: deleteListing
      description: |
        Refused once the listing has orders — the order history has to keep
        pointing at something, so the foreign key is ON DELETE RESTRICT.
      responses:
        "204":
          description: Deleted. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The listing has orders and cannot be deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /listings/{id}/report:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [listings]
      summary: Report a listing
      operationId: reportListing
      description: |
        Files a flag for a moderator. **The listing is not changed in any way** —
        not hidden, not flagged publicly, and the seller is not told. A report
        that hid a listing would let anyone with two accounts remove a
        competitor's.

        One report per person per listing; a second is a 409, which tells you
        your concern is already on record.

        There is no way to read reports here, or to see how many a listing has.
        The moderation queue is admin-only, and a public count would itself be
        a weapon.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportListingRequest"
      responses:
        "204":
          description: Filed. No body — there is no status for you to follow.
        "400":
          description: |
            Bad body, an unknown reason, detail over 500 characters, a
            missing detail on an `other` report, or your own listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: You have already reported this listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /listings/{id}/images:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [images]
      summary: List a listing's photos
      operationId: getListingImages
      security: []
      description: |
        Ordered by `position`. A listing id that does not exist returns an
        empty array, not a 404.
      responses:
        "200":
          description: The photos, ascending by position.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListingImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      tags: [images]
      summary: Upload a photo
      operationId: uploadListingImage
      description: |
        `multipart/form-data` with one file field named `image`. The type is
        decided by sniffing the file's first 512 bytes, not by the filename or
        the client's Content-Type — so a `.png` that is really a PDF is a 415.

        Limits come from the environment: `MAX_UPLOAD_BYTES` (default 5 MiB)
        and `MAX_IMAGES_PER_LISTING` (default 5).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary # "this field is a file", not text
      responses:
        "201":
          description: |
            Stored. `position` is one past the highest already in use, so a
            gap left by a deleted photo is never reused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingImage"
        "400":
          description: Not a multipart form, or no `image` field in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This listing already has the maximum number of images.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: |
            The upload exceeded `MAX_UPLOAD_BYTES`, and says which image was
            too large. A body over the API-wide cap is refused earlier, by the
            middleware, with the generic message instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Not a JPEG, PNG or WebP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # served outside /api/v1 - hence the per-path "servers" override below
  # ---------------------------------------------------------------------------
  /health:
    # A path may override the document's servers. Without this, the docs would
    # claim /api/v1/health, which does not exist.
    servers:
      - url: /
        description: Mounted at the root, not under /api/v1
    get:
      tags: [health]
      summary: Liveness and dependency check
      operationId: health
      security: []
      responses:
        "200":
          description: Everything is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: A dependency is down; `checks` says which.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /uploads/{filename}:
    servers:
      - url: /
        description: Mounted at the root, not under /api/v1
    get:
      tags: [images]
      summary: Fetch an uploaded image file
      operationId: getUpload
      security: []
      description: |
        Serves the bytes behind a `ListingImage.url`. Filenames are generated
        by the server; a name containing `/` is a 404, so the directory cannot
        be walked. Responses carry `X-Content-Type-Options: nosniff`.
      parameters:
        - name: filename
          in: path
          required: true
          description: Bare filename, no directories.
          schema:
            type: string
          examples:
            png:
              value: 0a7a0bc6-99f9-42f8-9ba0-c908a9cb3a93.png
      responses:
        "200":
          description: The image bytes.
          content:
            # Binary responses: name the media types, no schema needed.
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "206":
          description: |
            A byte range, when the request carried a `Range` header. These
            files are served by net/http's file server, which supports ranges.
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        "304":
          description: |
            Unchanged since the `If-Modified-Since` the request carried. No
            body. These responses carry `Last-Modified` but no `ETag`.
        "404":
          description: No such file. Plain text, not the JSON error envelope.
          content:
            text/plain: {}

  /listings/{id}/images/order:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [listings]
      summary: Reorder a listing's photos
      operationId: reorderListingImages
      description: |
        Rewrites the gallery to the order of the ids you send. Positions become
        `0..n-1`, derived from the array rather than sent alongside it — two
        parallel lists could disagree, one cannot.

        `position` is otherwise only ever written at insert, as
        `MAX(position) + 1`, so without this a gallery's order is frozen as its
        upload order and the cover photo is whichever file went up first.

        **The list must be exactly the listing's current images**, once each. A
        missing, extra or repeated id is a 400 rather than a partial reorder: a
        gallery half in the old order and half in the new is worse than one
        that did not change.

        A full-list PUT rather than a per-image PATCH, so it is idempotent and
        can be validated as a whole. A per-image patch would have to shuffle
        the other rows to make room, and two concurrent ones can interleave
        into a scrambled gallery.

        Seller only. One transaction: the unique constraint on
        `(listing_id, position)` is deferred, so a swap is momentarily a
        duplicate and only legal because the check waits for the commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderImagesRequest"
      responses:
        "200":
          description: The gallery in its new order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListingImage"
        "400":
          description: |
            Bad body, an unknown field, an id that is not a uuid, or a list
            that is not exactly this listing's images.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /listings/{id}/images/{imageID}:
    # Two path parameters. Note the casing: chi's route says {imageID}, so the
    # spec has to say {imageID} too.
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: imageID
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [images]
      summary: Delete a photo
      operationId: deleteListingImage
      description: |
        Removes the row and the file. Remaining photos keep their positions;
        gaps are allowed.
      responses:
        "204":
          description: Deleted. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # wishlist
  # ---------------------------------------------------------------------------
  /listings/{id}/save:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [wishlist]
      summary: Save a listing
      operationId: saveListing
      description: |
        Idempotent — saving a listing you already saved is still a 204, not a
        409 (the insert is `ON CONFLICT DO NOTHING`).
      responses:
        "204":
          description: Saved. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [wishlist]
      summary: Remove a listing from the wishlist
      operationId: unsaveListing
      description: |
        NOT idempotent, unlike save: removing something you had not saved is a
        404 ("listing was not saved").
      responses:
        "204":
          description: Removed. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}/follow:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [follows]
      summary: Follow a user
      operationId: followUser
      description: |
        Idempotent - following someone you already follow is still a 204. The
        edge is one-directional: this says nothing about whether they follow
        you back.
      responses:
        "204":
          description: Followed. No body.
        "400":
          description: The id is not a UUID, or it is your own - you cannot follow yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [follows]
      summary: Unfollow a user
      operationId: unfollowUser
      description: |
        Idempotent, like follow: unfollowing someone you were not following is
        still a 204, because not following them is the state you asked for.
        There is no 404 - "you were not following them" is not something a
        client can act on, and it would turn a retried mutation into a spurious
        error.
      responses:
        "204":
          description: Unfollowed. No body.
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}/block:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [blocks]
      summary: Block a user
      operationId: blockUser
      description: |
        Stops messaging in **both** directions: neither of you can start a
        conversation with the other or send into an existing one. One-way would
        leave the blocker able to open a thread the blocked party cannot answer.

        Idempotent — blocking someone already blocked is still a 204.

        A block does **not** remove a follow, and it does not affect orders. If
        the two of you have a sale in progress, `confirm`, `handover` and
        `receive` keep working: blocking is about messaging, and letting it
        strand an order would turn a safety feature into a way to break
        someone's transaction.
      responses:
        "204":
          description: Blocked. No body.
        "400":
          description: The id is not a uuid, or it is your own - you cannot block yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      tags: [blocks]
      summary: Unblock a user
      operationId: unblockUser
      description: |
        Restores messaging both ways, and the existing thread reappears in your
        inbox. Idempotent, like unfollow: unblocking someone who was not
        blocked is still a 204, since that is the state you asked for.
      responses:
        "204":
          description: Unblocked. No body.
        "400":
          description: The id is not a uuid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}/followers:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [follows]
      summary: List a user's followers
      operationId: getFollowers
      description: |
        Alphabetical by username, and unpaginated - deliberately, unlike
        listings: a follow list is bounded by how many people one person
        chooses to follow, while a catalogue is not. Revisit if these ever
        run to hundreds. Requires a token: a follower list is a social graph
        rather than public profile data.
      responses:
        "200":
          description: The people following that user, each with online status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatUser"
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}/following:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [follows]
      summary: List who a user follows
      operationId: getUserFollowing
      description: |
        The mirror of `/users/{id}/followers`, and public on the same terms:
        who someone follows is no more private here than who follows them, and
        hiding one but not the other would be an asymmetry rather than a
        privacy design. `/me/following` is the same list for the authenticated
        caller, without needing to know your own id.
      responses:
        "200":
          description: The people that user follows, each with online status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatUser"
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/avatar:
    post:
      tags: [me]
      summary: Set or replace your avatar
      operationId: uploadAvatar
      description: |
        `multipart/form-data` with one file field named `avatar`. The type is
        decided by sniffing the file's first 512 bytes, not by the filename or
        the client's Content-Type — so a `.png` that is really a PDF is a 415.
        `MAX_UPLOAD_BYTES` (default 5 MiB) caps the size.

        200 rather than 201: an avatar is singular, so posting again replaces
        the current one and deletes the file it displaced. Uploading twice is
        not a conflict, and there is never more than one to address.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "200":
          description: Stored, and any file it replaced deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Avatar"
        "400":
          description: Not a multipart form, or no `avatar` field in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: |
            The upload exceeded `MAX_UPLOAD_BYTES`, and says which image was
            too large. A body over the API-wide cap is refused earlier, by the
            middleware, with the generic message instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Not a JPEG, PNG or WebP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

    delete:
      tags: [me]
      summary: Revert to the default avatar
      operationId: deleteAvatar
      description: |
        Clears the avatar and deletes the stored file. Idempotent — clearing an
        avatar nobody set is still a 204, since the end state is identical.
      responses:
        "204":
          description: No avatar is set; `avatar_url` is now `null`.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/profile:
    get:
      tags: [me]
      summary: Get your own profile
      operationId: getOwnProfile
      responses:
        "200":
          description: Your profile, including the fields only you can see.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            The account behind this token no longer exists. Signup creates the
            profile row, so a missing profile means a missing user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags: [me]
      summary: Update your own profile
      operationId: updateOwnProfile
      description: |
        A partial update: fields you do not mention keep their current value.
        Both halves are written in one transaction, since `location` lives on
        the address rather than the profile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The profile after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnProfile"
        "400":
          description: |
            A malformed body, an unknown field, a value over its limit, a
            string containing a null byte, or a `date_of_birth` that is not a
            plain past date after 1900.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/notifications:
    get:
      tags: [notifications, me]
      summary: Your recent notifications
      operationId: getNotifications
      description: |
        Newest first, capped at the most recent 30 and unpaginated: this is what
        happened lately, not an archive.

        A notification carries a `kind` and the ids to link with, never a
        sentence. The wording is the client's, so it can be read in the reader's
        language rather than the one the server was written in.

        **Exactly one of the four subject ids is set**, and which one depends
        on the kind: the six order kinds point at an order, `chat_request` at a
        conversation, `listing_removed` and `saved_listing_gone` at a listing,
        and `new_follower`, `review_received` and `saved_listing_deleted` at a
        person. Route on `kind` rather than on whichever id is non-null.
      responses:
        "200":
          description: Your recent notifications, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/notifications/read:
    post:
      tags: [notifications, me]
      summary: Mark every notification read
      operationId: markNotificationsRead
      description: |
        Marks all of your unread notifications read. Idempotent: a second call
        matches nothing and still answers 204.
      responses:
        "204":
          description: Marked read.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/blocks:
    get:
      tags: [blocks, me]
      summary: List the people you have blocked
      operationId: getBlocks
      description: |
        Alphabetical by username, unpaginated. No `presence` — see `BlockedUser`.

        There is no endpoint for who *someone else* has blocked, or for who has
        blocked you. Both are deliberately absent rather than filtered.
      responses:
        "200":
          description: The people you have blocked.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/following:
    get:
      tags: [follows, me]
      summary: List the people you follow
      operationId: getFollowing
      description: |
        The "friends list". Alphabetical by username, unpaginated, and each row
        carries `presence` - so a client renders online status without a
        request per person.
      responses:
        "200":
          description: The people you follow.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [me]
      summary: Get someone else's public profile
      operationId: getPublicProfile
      security: []
      description: |
        Public, like the listing reads - a seller's profile should be readable
        while browsing. `presence` honours that user's `show_online_status`:
        with it off, the response is `{"is_online": false}` with no
        `last_seen_at`.

        **Presence needs a token.** Called without one, the `presence` field is
        omitted from the response entirely - the rest of the profile is public,
        but an anonymous caller cannot read anyone's online status. Otherwise a
        blocked user could read the blocker's presence by logging out.

        Omitted rather than sent as offline: a blanket false cannot be told
        apart from a real one, so a client would show "Offline" on every
        profile. Presence is also hidden - present, but offline - when either
        party has blocked the other.
      responses:
        "200":
          description: The public view of that profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProfile"
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/saved:
    get:
      tags: [wishlist, me]
      summary: List your saved listings
      operationId: getSavedListings
      description: Unpaginated. Photos are attached in one batch query.
      responses:
        "200":
          description: Your wishlist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Listing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # orders (simulated - no real money moves)
  # ---------------------------------------------------------------------------
  /orders:
    post:
      tags: [orders]
      summary: Place an order
      operationId: createOrder
      description: |
        Decrements the listing's stock in the same transaction, so two buyers
        racing for the last item cannot both succeed. Starts as `pending`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Order placed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: |
            Bad body, non-positive quantity, or your own listing — you cannot
            buy from yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not enough stock available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [orders]
      summary: List your orders
      operationId: getOrders
      description: Every order where you are the buyer OR the seller.
      responses:
        "200":
          description: Your orders.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [orders]
      summary: Get one order
      operationId: getOrder
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [orders]
      summary: An order's history
      operationId: getOrderEvents
      description: |
        Every transition the order made, oldest first: who did what, and when.
        A completed order has five entries - placed, confirmed, both halves of
        the handshake, and the completion.

        The two handshake entries share a `created_at`, because they are
        written in one transaction; they are ordered by `id` behind it.

        Buyer and seller only. An admin reads the same timeline through
        `GET /admin/orders/{id}/events`.
      responses:
        "200":
          description: The timeline, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            You are not the buyer or the seller. Note orders answer this with
            403 where conversations answer 404 - so an outsider can tell that
            an order id exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [orders]
      summary: Seller accepts the order
      operationId: confirmOrder
      description: "`pending` → `confirmed`. Seller only."
      responses:
        "200":
          description: The order, now `confirmed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The order is not `pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}/handover:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [orders]
      summary: Seller marks the goods handed over
      operationId: handoverOrder
      description: |
        Half of the two-sided handshake. Stamps `seller_handed_over_at`; the
        status only becomes `completed` once the buyer has called `/receive`
        as well. Calling it twice is a 409.
      responses:
        "200":
          description: |
            The order — `completed` if the buyer already confirmed receipt,
            otherwise still `confirmed` with the timestamp now set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Wrong status, or you already marked handover.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}/receive:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [orders]
      summary: Buyer confirms receipt
      operationId: receiveOrder
      description: |
        The other half of the handshake. Stamps `buyer_received_at`; the
        status becomes `completed` only once the seller has handed over too.
      responses:
        "200":
          description: The order, `completed` if both sides have now marked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Wrong status, or you already confirmed receipt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [orders]
      summary: Cancel an order
      operationId: cancelOrder
      description: |
        Either side, while the order is `pending` or `confirmed`. The reserved
        stock goes back to the listing. Once either side has marked the
        handshake, cancelling is refused.
      responses:
        "200":
          description: The order, now `cancelled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Already finished, or handover has started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # chat
  # ---------------------------------------------------------------------------
  /conversations:
    post:
      tags: [chat]
      summary: Ask a seller about a listing
      operationId: startConversation
      description: |
        Creates the conversation as `pending` and stores your opening message
        in the same transaction. One conversation per (listing, buyer): asking
        twice about the same listing is a 409, not a second thread.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartConversationInput"
      responses:
        "201":
          description: Created, awaiting the seller's answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: |
            Bad body, an empty message, or your own listing — you cannot start
            a chat with yourself.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            A block exists between you and the seller, in either direction. The
            message does not say so — it reads the same as any other closed
            thread.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: You have already contacted this seller about this listing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [chat]
      summary: List your conversations
      operationId: getConversations
      description: |
        Both sides, newest activity first. Each item carries a preview and an
        unread count, so the inbox needs one request rather than one per thread.
      responses:
        "200":
          description: Your conversations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationListItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /conversations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [chat]
      summary: Get one conversation
      operationId: getConversation
      description: |
        404 rather than 403 if you are not a participant, so this cannot be
        used to discover which conversations exist.
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /conversations/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [chat]
      summary: Seller accepts a chat request
      operationId: acceptConversation
      description: "`pending` → `accepted`. Seller only. No request body."
      responses:
        "200":
          description: The conversation, now `accepted`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the seller can answer a chat request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This request has already been answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /conversations/{id}/decline:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [chat]
      summary: Seller declines a chat request
      operationId: declineConversation
      description: |
        `pending` → `declined`, which is final: neither side can send again,
        and the buyer cannot re-open by asking about the same listing.
      responses:
        "200":
          description: The conversation, now `declined`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the seller can answer a chat request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: This request has already been answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /conversations/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [chat]
      summary: Read a conversation's messages
      operationId: getMessages
      description: |
        Always ascending by id. Two modes:

        - **no `after`** — the most recent `limit` messages (opening a thread).
        - **`after=<id>`** — everything newer than that id (the polling loop:
          keep the highest id you have seen and pass it back).

        Readable while the conversation is still `pending`, even though
        sending is not.
      parameters:
        - name: after
          in: query
          description: |
            Return only messages newer than this one. Omit it for the first
            page. Ids are uuid v7, so they sort chronologically and this stays
            a stable cursor even for two messages sent in the same
            millisecond.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: |
            Values above 100 are clamped to 100 rather than rejected, and 0
            means "use the default". Anything past the int32 maximum is a 400.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 50
      responses:
        "200":
          description: Messages, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [chat]
      summary: Send a message
      operationId: sendMessage
      description: |
        Only once the conversation is `accepted`. While it is `pending` the
        buyer's opening message is the only one allowed, so this is a 409.

        A block between the two participants is a 403, checked after the status
        rules — so a `pending` thread still returns its 409 first, and blocking
        does not change the response for a thread that was already refusing
        messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Sent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Bad body, empty after trimming, or over 2000 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            A block exists between the two participants, in either direction.
            Checked after the status rules, so a pending thread still returns
            its 409.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Not accepted yet, or the request was declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /conversations/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [chat]
      summary: Mark the other side's messages as read
      operationId: markConversationRead
      description: |
        Stamps `read_at` on the other user's unread messages, which is what
        clears this thread from `/me/unread`. Idempotent, and no request body.
      responses:
        "204":
          description: Marked. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # me
  # ---------------------------------------------------------------------------
  /me/export:
    get:
      tags: [users]
      summary: Download everything this account's data
      operationId: exportMyData
      description: |
        Every row the API already tells this account about itself, as one JSON
        document. `Content-Disposition` marks it as an attachment, so a browser
        saves it rather than rendering it.

        **Session only.** Like account deletion beside it, this is outside what
        an API key may do: one response containing everything about a person is
        exactly what a leaked key must not be able to fetch.

        JSON rather than CSV because the data is relational - orders reference
        listings, messages reference conversations - and a spreadsheet either
        flattens that into a lie or becomes a zip with a schema to explain. The
        field types are the same response shapes the individual endpoints
        publish.

        **Two things are deliberately absent**, both for reasons that hold
        elsewhere in this API:

        - **who has blocked this account.** A block is symmetric in its effects
          precisely so neither side learns who acted, and no endpoint exposes
          it.
        - **moderator notes.** They are written for admins about a person
          rather than for the person, and nothing shows them either.

        The other party's messages and the authors of reviews received ARE
        included: both are readable in the app already, so exporting them
        discloses nothing new, and leaving them out would produce half a
        conversation.
      responses:
        "200":
          description: The document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            An API key was used. This endpoint needs a browser session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            Exports are limited per account, and far more tightly than the
            API-wide budget: assembling one reads an entire account history and
            sends a confirmation email. Three per hour.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/api-keys:
    post:
      tags: [me]
      summary: Create an API key
      operationId: createAPIKey
      # Bearer only: a key must not be able to mint another key.
      security:
        - bearerAuth: []
      description: |
        Returns the key **once**. Only its SHA-256 hash is stored, so there is
        no endpoint that can show it again - if it is lost, revoke it and
        create another.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKey"
      responses:
        "201":
          description: The key, for the only time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: An API key cannot manage API keys; log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      tags: [me]
      summary: List your API keys
      operationId: getAPIKeys
      security:
        - bearerAuth: []
      description: |
        Never includes the keys themselves - only the prefix, which is enough
        to tell one row from another.
      responses:
        "200":
          description: Your keys, newest first. Revoked ones are included.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: An API key cannot manage API keys; log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [me]
      summary: Revoke an API key
      operationId: revokeAPIKey
      security:
        - bearerAuth: []
      description: |
        Takes effect on the next request - the key is looked up every time, so
        there is no cache to wait out.
      responses:
        "204":
          description: Revoked. No body.
        "400":
          description: The id is not a UUID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: An API key cannot manage API keys; log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |
            No such key of yours. Someone else's key and one you already
            revoked answer the same way, so this cannot be used to discover
            which ids exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/settings:
    get:
      tags: [me]
      summary: Get your settings
      operationId: getSettings
      responses:
        "200":
          description: Your settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
    patch:
      tags: [me]
      summary: Update your settings
      operationId: updateSettings
      description: |
        Turning `show_online_status` off makes you look permanently offline to
        everyone else — your presence stops being reported, not just hidden.
        Omitting the field entirely is a 400, not a no-op.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsInput"
      responses:
        "200":
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/unread:
    get:
      tags: [me, chat]
      summary: Your total unread message count
      operationId: getUnreadCount
      description: Across every conversation — for a badge in the header.
      responses:
        "200":
          description: The count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------------------
  # admin orders
  # ---------------------------------------------------------------------------
  /admin/orders:
    get:
      tags: [admin]
      summary: Browse every order
      operationId: listOrdersForAdmin
      description: |
        Every order, newest first, with the filters an admin needs to find the
        ones that need attention.

        `?stuck=true` is the important one: it returns the orders trapped
        mid-handover for **more than seven days**, which is the working queue
        this endpoint exists for. The age threshold matters - without it a
        handover seconds old would appear here while the buyer is still on
        their way to collect.
      parameters:
        - name: status
          in: query
          description: Anything outside the enum is a 400.
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: stuck
          in: query
          description: |
            `true` returns only orders trapped mid-handover for more than
            seven days; `false` returns only orders that are not. Omit it for
            both. A handshake younger than that counts as in progress, not
            stuck.
          schema:
            type: boolean
        - name: created_from
          in: query
          description: |
            Inclusive lower bound. Accepts RFC 3339, or `YYYY-MM-DD` - a bare
            date is read as UTC midnight, so a range picked in a local timezone
            is offset by that timezone's UTC difference.
          schema:
            type: string
            examples: ["2026-08-01"]
        - name: created_to
          in: query
          description: |
            **Exclusive** upper bound, so `created_from=2026-08-01` with
            `created_to=2026-09-01` is exactly August and consecutive ranges
            tile without overlapping.

            A bare `YYYY-MM-DD` is UTC midnight here too, so from a timezone
            ahead of UTC the range ends early - `created_to=2026-08-31` from
            Helsinki drops the last three hours of the 30th.
          schema:
            type: string
            examples: ["2026-09-01"]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Values above 50 are clamped to 50 rather than rejected.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of orders, plus the totals for a pager.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAdminOrders"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/orders/{id}/resolve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [admin]
      summary: End an order no party can move
      operationId: resolveOrder
      description: |
        Forces a stuck order to a terminal status, records the reason in its
        event history, and returns the quantity to stock unless the outcome is
        `completed`. One transaction: all of it, or none.

        **Only stuck orders**, in either of the senses described on
        `OrderStatus`: left mid-handover for more than seven days, or left with
        no living party because both accounts were deleted. An admin cannot
        rewrite an order that is still moving or already finished - that is a
        409, not a 403, because it is about the order's state rather than the
        caller's rights. The seven days exist so an admin cannot close a trade
        the counterparty is still completing, and they apply whenever a
        handshake timestamp is set — **including when both parties have since
        deleted their accounts.** A mark records that something physically
        happened, and the wait is what separates a slow trade from an abandoned
        one; that a party has left does not make the goods un-handed-over.

        **An order neither party ever acted on can only be resolved as
        `cancelled`.** That is the second shape above, recognised by both
        handshake timestamps being unset rather than by whether anyone is left
        alive. `completed` would assert a handover that never happened, and
        `refunded` implies the trade got far enough to need unwinding. Both are
        refused. An abandoned order that *does* carry a handshake mark is the
        first shape, and after seven days accepts all three outcomes.

        The check runs inside the transaction after locking the row, so an
        order that stops being stuck while the admin is looking at the list
        cannot be overwritten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveOrderRequest"
      responses:
        "200":
          description: The order in its new state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "400":
          description: Bad body, an unknown field, an unknown outcome, or a missing reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The order is not stuck, so there is nothing to resolve - or it has
            no living party and the outcome was not `cancelled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/orders/{id}/events:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [admin, orders]
      summary: An order's history, for an admin
      operationId: getOrderEventsForAdmin
      description: |
        The same timeline `GET /orders/{id}/events` returns, for an admin who
        is not a party to the order — which is every admin judging one, since
        that endpoint is buyer-and-seller only.

        Without this an admin can see where a stuck order ended but not how it
        got there, and cannot read back the `reason` another admin wrote when
        resolving it: `POST /admin/orders/{id}/resolve` records that reason
        into this history, and until now the only people who could read it
        were the two it was written for.

        Same query, same `OrderEvent` schema and the same order as the parties
        get. An admin reading a different history from the people it is about
        would be worse than reading none.
      responses:
        "200":
          description: The timeline, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/reports:
    get:
      tags: [moderation]
      summary: The moderation queue
      operationId: getReportQueue
      description: |
        Every listing with at least one open report, oldest complaint first.

        Grouped **by listing, not by report** — three people reporting one
        listing is one problem, and one decision resolves all three.
      responses:
        "200":
          description: The queue. An empty array means nothing is pending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportedListing"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/listings/{id}/reports:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [moderation]
      summary: Every report filed against one listing
      operationId: getListingReports
      description: |
        The detail behind a queue row, resolved ones included, newest first —
        a listing reported before and cleared is context for deciding again.
      responses:
        "200":
          description: The reports. Empty if the listing was never reported.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/listings/{id}/moderation:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [moderation]
      summary: What moderators have done to this listing
      operationId: getModerationHistory
      description: |
        The audit trail, newest first. Append-only: nothing here is edited or
        deleted, so a listing removed and restored shows both.
      responses:
        "200":
          description: The actions. Empty if it was never moderated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModerationAction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/listings/{id}/moderate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [moderation]
      summary: Decide a reported listing
      operationId: moderateListing
      description: |
        One transaction: set or clear the listing's removed state, resolve
        every open report against it, and write the audit row. Either all
        three happen or none do.

        Removal is a state, not a delete — a listing anyone has ordered cannot
        be deleted at all, and deleting one would take the reports explaining
        why with it.

        **The listing's images stop being served too.** Removal moves the files
        out of the public upload directory and `restore` moves them back, so a
        URL handed out before the removal stops working. Without that the
        listing would be hidden while the content that caused the removal kept
        serving to anyone holding the link.

        A removed listing is **404 everywhere** — browse, search, fetch by id,
        images, ordering, chat and saving. Only its seller and admins can still fetch
        it, and only then does `removed_at` appear on the listing. Anything
        else would let the API confirm that a named seller was moderated.

        Orders placed before removal are untouched and stay cancellable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerateListingRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerateListingResponse"
        "400":
          description: |
            Bad body, an unknown action, a note over 500 characters, or a
            `remove` with no reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Removing an already-removed listing, restoring one that is not
            removed, or dismissing the reports on a removed one. The first two
            usually mean another moderator got there first; the third would
            clear the queue while leaving the listing invisible and reachable
            only by uuid, so restore it first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/users:
    get:
      tags: [admin]
      summary: Browse every account
      operationId: listUsersForAdmin
      description: |
        One page of accounts, newest first, deleted ones included. Filters
        combine with AND; both reject an unknown value rather than ignoring it,
        so a typo in `status` is a 400 and not a silently unfiltered list.
      parameters:
        - name: role
          in: query
          description: Anything outside this list is a 400.
          schema:
            type: string
            enum: [USER, ADMIN]
        - name: status
          in: query
          description: Anything outside this list is a 400.
          schema:
            type: string
            enum: [active, suspended, deleted]
        - name: page
          in: query
          description: 1-based. A page past the end returns an empty `items`.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Values above 50 are clamped to 50 rather than rejected.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of accounts, plus the totals for a pager.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAdminUsers"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/users/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [admin]
      summary: What admins have done to this account
      operationId: getUserHistory
      description: |
        The audit trail, newest first. Nothing here is edited or deleted, so an
        account suspended and reinstated twice shows all four rows.

        A deleted account keeps its history - that is the point of anonymising
        the row instead of dropping it.
      responses:
        "200":
          description: The actions. Empty if the account was never actioned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/users/{id}/suspend:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [admin]
      summary: Suspend an account
      operationId: suspendUser
      description: |
        Blocks the account from every authenticated route. They keep their
        password and their data - a suspension is reversible, which is what
        separates it from a deletion.

        **They are told why.** Their next request is a 403 naming the reason,
        and logging in returns the same rather than "wrong password" - but only
        *after* the password check passes, so the endpoint never reveals an
        account's state to someone who cannot get into it.

        Their listings stop appearing anywhere, exactly as a deleted user's do.

        One transaction: set the state and write the audit row, or neither.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendRequest"
      responses:
        "200":
          description: The account in its new state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Bad body, an unknown field, a missing reason, or one over 500 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Not an admin, or an admin aiming at their own account. Suspending
            yourself would lock you out of the endpoint that undoes it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Already suspended - usually another admin got there first - or the
            target is the last active admin, which would leave the instance
            with nobody able to moderate it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/users/{id}/reinstate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [admin]
      summary: Lift a suspension
      operationId: reinstateUser
      description: |
        Clears the suspension and its reason, and writes the audit row. The
        account works again immediately - nothing was taken from it.

        There is no last-admin guard here: reinstating an admin cannot leave
        the instance short of one.

        A deleted account cannot be reinstated. Deletion is the one state with
        no way back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReinstateRequest"
      responses:
        "200":
          description: The account in its new state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The account is not suspended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/users/{id}/role:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [admin]
      summary: Promote or demote an account
      operationId: setUserRole
      description: |
        Sets the account's role and writes the audit row - `promoted` or
        `demoted`, whichever the change was.

        **It takes effect on the subject's next request.** The role is read from
        the database by `RequireRole`, not from their token, so a promotion
        needs no new login and a demotion cannot be outlived by an access token
        that has not expired yet.

        One PATCH carrying the wanted value rather than `/promote` and
        `/demote`: a role is a value, and a third role later adds a constant
        instead of a second pair of endpoints.

        **Refusals.** You cannot change your own role - an admin who demotes
        themselves loses the endpoint that would undo it. The last active admin
        cannot be demoted, checked under `LockAdminRoster` in the same
        transaction as the write, so two admins demoting each other at once
        cannot both succeed and empty the roster. Promotion has no such guard:
        it cannot leave the instance short.

        A deleted account is a 404, as everywhere else.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleRequest"
      responses:
        "200":
          description: |
            The account in its new state - or unchanged, if it already had the
            role asked for.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The last active admin cannot be demoted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [admin]
      summary: Delete an account
      operationId: deleteUserAsAdmin
      description: |
        The same scrub as `DELETE /me` - the account is anonymised, not
        removed, for the reasons set out there - plus an audit row saying who
        did it and why.

        Because it is the identical scrub, everything true of a self-deletion
        is true here: orders survive on both sides, conversations survive for
        the counterparty, and orders already in flight are neither blocked nor
        unwound.

        Requires the target's exact username in the body. Irreversible, and the
        confirmation is what stops a mis-clicked row in an admin list from
        ending the wrong account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminDeleteRequest"
      responses:
        "204":
          description: Deleted. No body.
        "400":
          description: Bad body, a missing or wrong `username`, or a missing reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Not an admin, or an admin aiming at their own account - use
            `DELETE /me`, which asks for your own confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The target is the last active admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /me:
    delete:
      tags: [me]
      summary: Delete your account
      operationId: deleteAccount
      description: |
        Ends your account. **The row is not deleted** — it is anonymised, and
        the difference is deliberate.

        `orders` references `users` with `ON DELETE RESTRICT` on both the buyer
        and the seller side, so anyone who has ever traded cannot be deleted at
        all. And `messages` cascades from `conversations`, which cascades from
        either participant — so a real delete would destroy the *other* party's
        copy of a shared thread, including messages they wrote.

        **Erased:** email, username, password, profile (name, bio, phone, date
        of birth), the avatar file on disk, addresses, follows, blocks, saved
        listings and any linked Google or GitHub identity. Sessions and API
        keys are revoked.

        **Kept:** orders on both sides, order events, and conversations — those
        belong to the counterparty as much as to you. You appear to them as
        "Deleted user", and they can no longer message you. Reports you filed
        and moderation actions you took survive with your id detached.

        Your listings stop appearing anywhere and can no longer be bought.

        **Orders already in flight are not blocked or unwound.** You can delete
        with a pending order, and the other party is left able to cancel it and
        nothing else — they cannot message you, and you can no longer confirm or
        hand over. That is deliberate: an order is a record of what happened, so
        it is never destroyed, and refusing deletion until every order settles
        would let one counterparty hold an account open indefinitely. Cancel
        what is outstanding first if you would rather not leave it to them.

        If the other party has already deleted their account, nobody is left who
        can end the order at all. It is still not unwound here — it becomes
        resolvable by an admin instead, described on `OrderStatus`.

        Send your own username in the body to confirm. Requires a browser
        session: an API key cannot delete the account it authenticates.

        Access ends immediately. Sessions and API keys are revoked, and every
        authenticated route re-checks the account against the database, so an
        access token issued moments before the deletion stops working too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Done. The refresh cookie is cleared.
        "400":
          description: Bad body, or the username did not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: An API key cannot delete an account; log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /me/password:
    post:
      tags: [me]
      summary: Change your password
      operationId: changePassword
      description: |
        Sets a new password from an existing session, proving you know the
        current one. That is not redundant with being signed in: every other
        way to mint a password here proves something first — the reset link
        proves control of the mailbox — and a check that skipped it would be
        the weakest path into the account.

        **Every other session ends, and this one continues.** Sessions and API
        keys are revoked, then a fresh session is issued to you and returned as
        a new refresh cookie, so the device you changed it on stays signed in
        and every other device is signed out.

        One limit worth knowing, shared with the reset flow: access tokens are
        JWTs and are never looked up, so another device keeps working until its
        current token expires — at most 15 minutes — even though it can no
        longer refresh.

        Requires a browser session: an API key cannot change the password of
        the account it authenticates, the same rule that guards account
        deletion.

        Not for accounts created through Google or GitHub. They have no
        password, and this must not become the endpoint that gives them one:
        a provider hands over an address that may live in a weaker mailbox than
        the provider account itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Done. The refresh cookie carries the replacement session.
        "400":
          description: |
            Bad body, or the new password fails the rules - including being the
            same as the current one, which would end every other session for a
            change that changes nothing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            Not signed in. A wrong current password is 403, not 401 - see below.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The session is valid but this attempt is not: the current password
            is wrong, or an API key was used instead of a browser session. The
            two are told apart by the message.

            A wrong password is deliberately **not** 401. That status means
            "your session is no good", and clients act on it - this one's web
            frontend silently refreshes and replays the request, which would
            spend a second bcrypt on the same wrong password and, if the
            refresh happened to fail, sign the user out over a typo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This account signs in with a provider and has no password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /orders/{id}/review:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [reviews]
      summary: The review on one order
      operationId: getOrderReview
      description: |
        Reads back the review attached to an order, which is how a buyer finds
        their own without paging through the seller's whole list and matching on
        `order_id`.

        **Only the buyer and the seller** may ask, and a caller who is neither
        gets the same 404 as a caller asking about an order that does not
        exist - otherwise the endpoint would confirm which order ids are real.
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No such order, no review on it yet, or the caller is not a party to
            it. Deliberately one answer for all three.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      tags: [orders]
      summary: Review a completed order
      operationId: createReview
      description: |
        Rate the seller after a trade. The review is anchored to the **order**,
        not to the seller — one per completed trade, enforced by a unique index
        rather than a check in code, because a check is a read that two
        concurrent submissions both pass.

        That anchoring is the point: a review cannot exist without a
        transaction behind it, and cannot be repeated to inflate or sink
        someone's average.

        The order must be `completed`, which here means both parties acted —
        the seller handed over and the buyer confirmed receipt.

        Only the buyer on that order may review it. Anyone else gets 404 rather
        than 403: someone with no part in an order should not learn it exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Bad body, a rating outside 1–5, or a comment over 1000 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The order is not completed yet, or you have already reviewed it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /reviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [orders]
      summary: Edit your review
      operationId: updateReview
      description: |
        Editable, not deletable. A mis-clicked one star deserves a fix; a review
        that vanishes after a dispute does not. `updated_at` moves, so an edited
        review is visible as edited.

        An edit is validated exactly as the original was — rules checked only on
        the way in are rules you can get around later.

        Someone else's review answers 404, the same as one that does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Bad body, a rating outside 1–5, or a comment over 1000 characters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"

  /users/{id}/reviews:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [users]
      summary: Reviews written about a seller
      operationId: getSellerReviews
      security: []
      description: |
        Public, like the seller's profile: reputation is what a buyer reads
        before deciding to sign up, so putting it behind a token would hide it
        from the people it is for.

        Newest first, **paginated** — the same envelope as `GET /listings/search`
        rather than a bare array, so a seller with hundreds of reviews does not
        return all of them at once.

        A review whose author has since deleted their account is still here,
        attributed to "Deleted user" — the summary on the profile counts it too,
        because a seller's average should not move for reasons that have nothing
        to do with the seller.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Values above 50 are clamped to 50 rather than rejected.
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: One page of reviews, plus the totals for a pager.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedReviews"
        "400":
          description: Invalid user id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"
