version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ENV=dev
      - PORT=8080
      - DB_URL=postgres://postgres:postgres@db:5432/transcendence?sslmode=disable
      depends_on:
      - db
      volumes:
      - .:/app
    command: go run ./cmd/server

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=transcendence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  