root = "."

# Outside the source tree on purpose. Inside a container the tree is a bind
# mount, so anything written here appears on the host owned by the container's
# user - which is how frontend/node_modules ended up owned by root (#184). An
# absolute path the mount does not reach avoids the question entirely, and host
# runs behave the same.
tmp_dir = "/tmp/air"

[build]
  cmd = "go build -o /tmp/air/server ./cmd/server"
  bin = "/tmp/air/server"
  # yaml is here because api/openapi.yaml is //go:embed-ed into the binary.
  # Drop it and editing the spec leaves /docs serving the old one until someone
  # restarts by hand, with nothing to say why.
  include_ext = ["go", "yaml", "mod", "sum"]
  exclude_dir = ["uploads", "sql"]
  exclude_regex = ["_test\\.go$"]
  stop_on_error = true
  delay = 200

[misc]
  clean_on_exit = true
