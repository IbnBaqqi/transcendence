# Production-shaped stack: both services run from their built images, with no
# source mounts and no toolchain in the runtime containers. Standalone rather
# than an overlay on docker-compose.yml, because overriding that file's source
# mounts and dev commands relies on merge rules that fail quietly when wrong.
#
#   docker compose -f docker-compose.prod.yml up --build
#
# Only the frontend publishes a port. The API is reached through nginx on the
# same origin, which is what the browser already assumes.

# Its own project name. Without this both files share the directory-derived
# project, so the two stacks fight over the same container names and a `down`
# on one takes services from the other with it.
name: transcendence-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # No restart policy here on purpose: this is a one-shot that must run to
  # completion. A restart would relaunch it after it exits 0, and backend's
  # service_completed_successfully would never settle.
  migrate:
    build:
      context: ./backend
      target: migrator
    environment:
      GOOSE_DBSTRING: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      # Explicit: the migrator stage comes after this one in the Dockerfile, and
      # an untargeted build takes the LAST stage - which silently produced a
      # backend container running goose.
      target: runtime
    env_file: .env
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      UPLOAD_DIR: /app/uploads
      # .env is the dev file, and three of its values are wrong for this stack.
      # Overridden here rather than fixed there, because dev still needs them.
      #
      # The browser reaches everything through nginx on 8080, so that is the
      # frontend origin - .env says 5173, which is Vite and is not running here.
      # OAuth redirects land on this value, so a stale one sends the user to a
      # dead port at the end of a successful sign-in.
      # One HTTPS origin now, so these follow it. OAuth redirects land on
      # FRONTEND_URL, and PUBLIC_URL is what the callback URL is built from.
      FRONTEND_URL: ${APP_ORIGIN:-https://localhost}
      PUBLIC_URL: ${APP_ORIGIN:-https://localhost}
      # .env keeps this false because the dev stack is plain http, where a
      # Secure cookie is never sent back and the refresh flow fails silently.
      # This stack has TLS, so the cookie can carry the flag it should.
      COOKIE_SECURE: "true"
      # No mailpit service in this stack, so .env's SMTP_HOST=mailpit does not
      # resolve. Empty means Configured() is false and notifications are logged
      # instead of sent: a loud no-op beats a silent failure against a host that
      # is not there. Set a real host to actually send.
      SMTP_HOST: ""
    volumes:
      - uploads_prod:/app/uploads
    restart: unless-stopped
    # /health reports 503 rather than 200 when the database check fails, so this
    # tracks "can serve requests", not merely "process is alive". wget is
    # BusyBox's, present in the alpine runtime image.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      # nginx listens unprivileged inside the container and is published on the
      # privileged ports here, so the bind happens in the daemon rather than in
      # a container that dropped root. 80 only redirects to 443.
      #
      # Overridable because rootless Docker cannot bind either one: there the
      # daemon runs as the user, and raising the limit needs a root we do not
      # have on a school machine. Off 443 use the https URL directly - nginx
      # redirects with $host, which carries no port, so plain http sends the
      # browser to a port nothing is listening on.
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTP_PORT:-80}:8080"
    volumes:
      # Read-only, and generated by `make certs` rather than committed: a
      # private key in the repository is a leaked key even when it is a
      # throwaway.
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
    # Waits for a backend that answers, not just one that has been created, so
    # startup is deterministic - the same shape db and migrate already use.
    # This does not replace nginx.conf's resolver: that exists for the backend
    # going away and coming back later, which no startup ordering can cover.
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data_prod:
  uploads_prod:
