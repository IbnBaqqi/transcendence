name: Frontend

# The filtering lives in the `changes` job below, NOT in a `paths:` filter on
# the trigger. That is what lets this check be required in branch protection:
# a workflow filtered out at the trigger never reports at all, so a required
# check waits forever and the PR can never merge. A job skipped by `if:` does
# report - as "skipped", which protection accepts.
#
# So do not move these paths back up into `on:` if the ruleset is ever set to
# require "Frontend Checks". It looks like the same thing and it silently
# wedges every backend-only PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    name: Detect changes (frontend)
    runs-on: ubuntu-latest
    # Listing a pull request's files is the pull-requests scope, not contents.
    # Without this the call 403s wherever the default token is restricted, and
    # the fail-open below quietly runs everything on every PR.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.run }}

    steps:
      # No checkout: the API knows what a pull request touches, and skipping the
      # clone is what keeps this job seconds rather than tens of them.
      - name: Decide whether the frontend changed
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A push to main is not a pull request and has nothing to diff
          # against here - main gets the full suite.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail open: if the listing fails, run everything rather than
          # reporting a green PR nothing was checked on.
          if ! files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename'); then
            echo "could not list changed files - running everything"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The whole workflows directory rather than this file alone: a shared
          # action or reusable workflow added later is invisible to the narrow
          # form. The cost is that editing backend.yml runs the npm suite.
          if printf '%s\n' "$files" | grep -qE '^(frontend/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: Frontend Checks
    needs: changes
    # Runs when the gate says so, and also when the gate did not succeed at
    # all: a failed detection job would otherwise skip these, and a skipped
    # required check is accepted - a green PR nothing was checked on. The
    # script fails open on its own errors; this covers the job dying around
    # it. !cancelled() rather than always(), so cancelling a run still stops
    # the suite.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
