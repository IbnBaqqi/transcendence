name: CI

on:
  pull_request:
    branches: [main]
    # paths:
    #   - 'backend/**'
    #   - '.github/workflows/ci.yml'

jobs:
  tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Same image as docker-compose, so CI and laptops run the same Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # The job starts as soon as the container does, which is before
        # Postgres accepts connections — this makes it wait for pg_isready.
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"

      - name: Run unit test
        env:
          # Without this the database tests skip; with it they run for real.
          TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -race -cover ./...

      - name: Install gosec
        # Pinned for the same reason as staticcheck below: a new release can
        # add rules that fail a commit nobody touched. Keep in step with
        # GOSEC in backend/Makefile.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Check security with gosec
        # -exclude-generated skips the sqlc output. Query constants containing
        # the words "password" or "token" trip G101 (hardcoded credentials),
        # and those files cannot carry a #nosec: make sqlc would overwrite it.
        # Only files matching "Code generated by ... DO NOT EDIT." are skipped.
        run: gosec -exclude-generated ./...

  style:
    name: Backend Style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"

      - name: Check code formatting
        run: test -z $(go fmt ./...)

      - name: Check linting
        uses: dominikh/staticcheck-action@v1
        with:
          # Pinned, not "latest": a new release can add checks that fail a
          # commit nobody touched.
          version: "2026.1"
          # The action installs Go "stable" by default, which overrides the
          # version pinned above. When Go 1.27 became stable, staticcheck could
          # no longer decode the standard library ("export data version 4 is
          # greater than maximum supported version 2") and every run failed.
          # A staticcheck release only supports the Go minor current at its
          # time, so it has to use ours.
          install-go: "false"
          working-directory: backend

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
