name: CI

on:
  pull_request:
    branches: [main]
    # paths:
    #   - 'backend/**'
    #   - '.github/workflows/ci.yml'

jobs:
  tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"

      - name: Run unit test
        run: go test -cover ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Check security with gosec
        run: gosec ./...

  style:
    name: Backend Style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"

      - name: Check code formatting
        run: test -z $(go fmt ./...)

      - name: Check linting
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          working-directory: backend
