name: Backend

# The filtering lives in the `changes` job below, NOT in a `paths:` filter on
# the trigger. That is what lets these checks be required in branch protection:
# a workflow filtered out at the trigger never reports at all, so a required
# check waits forever and the PR can never merge. A job skipped by `if:` does
# report - as "skipped", which protection accepts.
#
# So do not move these paths back up into `on:` while the ruleset requires
# "Backend Tests" or "Backend Style". It looks like the same thing and it
# silently wedges every frontend-only PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    name: Detect changes (backend)
    runs-on: ubuntu-latest
    # Listing a pull request's files is the pull-requests scope, not contents.
    # Without this the call 403s wherever the default token is restricted, and
    # the fail-open below quietly runs everything on every PR.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.run }}

    steps:
      # No checkout: the API knows what a pull request touches, and skipping the
      # clone is what keeps this job seconds rather than tens of them.
      - name: Decide whether the backend changed
        id: filter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A push to main is not a pull request and has nothing to diff
          # against here - main gets the full suite.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Fail open: if the listing fails, run everything rather than
          # reporting a green PR nothing was checked on.
          if ! files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename'); then
            echo "could not list changed files - running everything"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The whole workflows directory rather than this file alone: a shared
          # action or reusable workflow added later is invisible to the narrow
          # form. The cost is that editing frontend.yml runs the Go suite.
          if printf '%s\n' "$files" | grep -qE '^(backend/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Backend Tests
    needs: changes
    # Runs when the gate says so, and also when the gate did not succeed at
    # all: a failed detection job would otherwise skip these, and a skipped
    # required check is accepted - a green PR nothing was checked on. The
    # script fails open on its own errors; this covers the job dying around
    # it. !cancelled() rather than always(), so cancelling a run still stops
    # the suite.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Same image as docker-compose, so CI and laptops run the same Postgres.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # The job starts as soon as the container does, which is before
        # Postgres accepts connections — this makes it wait for pg_isready.
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"

      - name: Run unit test
        env:
          # Without this the database tests skip; with it they run for real.
          TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        # 30m, not Go's 10m default. internal/service is the reason: measured
        # alone it takes about 16 minutes, because each of its ~230 tests
        # creates and migrates its own database, so every migration added to
        # sql/migrations costs all of them. Inside `go test ./...` it runs
        # alongside auth and handler against one Postgres, and that contention
        # took it past a 20m ceiling on a developer laptop while passing in
        # under 6 here. Raised so the local run is not the flakier one.
        # Keep in step with the test targets in backend/Makefile.
        run: go test -race -cover -timeout 30m ./...

      - name: Install gosec
        # Pinned for the same reason as staticcheck below: a new release can
        # add rules that fail a commit nobody touched. Keep in step with
        # GOSEC in backend/Makefile.
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Check security with gosec
        # -exclude-generated skips the sqlc output. Query constants containing
        # the words "password" or "token" trip G101 (hardcoded credentials),
        # and those files cannot carry a #nosec: make sqlc would overwrite it.
        # Only files matching "Code generated by ... DO NOT EDIT." are skipped.
        run: gosec -exclude-generated ./...

  style:
    name: Backend Style
    needs: changes
    # Runs when the gate says so, and also when the gate did not succeed at
    # all: a failed detection job would otherwise skip these, and a skipped
    # required check is accepted - a green PR nothing was checked on. The
    # script fails open on its own errors; this covers the job dying around
    # it. !cancelled() rather than always(), so cancelling a run still stops
    # the suite.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"

      - name: Check code formatting
        run: test -z $(go fmt ./...)

      - name: Check linting
        uses: dominikh/staticcheck-action@v1
        with:
          # Pinned, not "latest": a new release can add checks that fail a
          # commit nobody touched.
          version: "2026.1"
          # The action installs Go "stable" by default, which overrides the
          # version pinned above. When Go 1.27 became stable, staticcheck could
          # no longer decode the standard library ("export data version 4 is
          # greater than maximum supported version 2") and every run failed.
          # A staticcheck release only supports the Go minor current at its
          # time, so it has to use ours.
          install-go: "false"
          working-directory: backend
