services:
  # --- database ---
  db:
    image: postgres:16-alpine
    env_file: .env                                              # loads POSTGRES_* from .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"                                             # expose to host
    volumes:
      - postgres_data:/var/lib/postgresql/data                  # data survives restarts
    healthcheck:                                                # lets backend wait until db is ready
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- adminer (browser UI for the database, dev only) ---
  adminer:
    image: adminer:6                   # track the major, like postgres:16-alpine and
                                       # node:20-alpine: patches arrive on pull, a
                                       # breaking major still needs a deliberate edit
    profiles: [tools]                  # opt-in: won't start on a plain `docker compose up`
    environment:
      ADMINER_DEFAULT_SERVER: db       # pre-fills the "Server" box with the service name
    ports:
      - "127.0.0.1:8081:8080"          # adminer listens on 8080 inside; 8080 is the backend's
    depends_on:
      db:
        condition: service_healthy     # same wait the backend uses

  # --- mailpit (catches outgoing mail, dev only) ---
  mailpit:
    image: axllent/mailpit:v1.31     # no bare-major tag exists, so pin the minor
    restart: unless-stopped
    # No `profiles` unlike adminer: the backend connects to this one, so an
    # opt-in service would mean a dial error on every notification.
    ports:
      - "127.0.0.1:1025:1025"        # SMTP, what the backend sends to
      - "127.0.0.1:8025:8025"        # web UI, where you read what was sent

  # --- migrations (goose one-shot, mirrors prod) ---
  migrate:
    # The migrator stage: the pinned goose plus a copy of sql/migrations. The
    # read-only bind mount below shadows that copy, so a new migration applies
    # on the next `up` without rebuilding the image.
    build:
      context: ./backend
      target: migrator
    environment:
      GOOSE_DBSTRING: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ./backend/sql/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  # --- backend (Go) ---
  backend:
    # The dev stage: the Go toolchain plus a pinned air, watching the bind mount
    # below. target is required - an untargeted build takes the file's last
    # stage, which is the migrator.
    build:
      context: ./backend
      target: dev
    working_dir: /app
    env_file: .env
    environment:
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      # Overridable from the shell for a quick demo:
      #   RATE_LIMIT_PER_MINUTE=10 docker compose up -d backend
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app                                        # live source
      - uploads:/app/uploads                                  # images survive rebuilds
      - go-mod-cache:/go/pkg/mod                              # downloaded modules
      # Compiled package objects. GOCACHE defaults into the container's
      # writable layer, so without this every `down` throws away the build and
      # the first edit afterwards recompiles every dependency.
      - go-build-cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy                            # wait for the healthcheck above
      migrate:
        condition: service_completed_successfully             # schema exists before air starts

  # --- frontend (Vite dev server)
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"     # --host = reachable from your browser
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules                                     # keep the containers node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  go-mod-cache:
  go-build-cache:
  uploads:
