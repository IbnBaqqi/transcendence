server {
    listen 8080;

    # Docker's embedded DNS. Without a resolver nginx looks the backend up once
    # at startup and refuses to boot if it is not running yet; with it, the name
    # is resolved per request, so a backend restart does not strand a stale IP.
    resolver 127.0.0.11 valid=10s;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the URL space, so a deep link like /listings/<id> has no
    # file behind it. Without this fallback a refresh on any route but "/" is a
    # 404 from nginx that never reaches the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mirrors the dev proxy in vite.config.ts. The browser calls same-origin
    # paths, so these two must reach the API or every request 404s as a
    # missing static file.
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
