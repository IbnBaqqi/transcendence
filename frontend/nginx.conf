# Plain HTTP exists only to send people to HTTPS. The refresh cookie is Secure,
# so a session started over http:// would fail to refresh with nothing on screen
# to explain it - better to never serve the app there at all.
server {
    listen 8080;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # 8443, not 443: this image runs nginx unprivileged, so it cannot bind a
    # privileged port. docker-compose.prod.yml publishes it as 443, which puts
    # the privileged bind in the daemon rather than in a container that dropped
    # root.
    listen 8443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

    # Docker's embedded DNS. Without a resolver nginx looks the backend up once
    # at startup and refuses to boot if it is not running yet; with it, the name
    # is resolved per request, so a backend restart does not strand a stale IP.
    resolver 127.0.0.11 valid=10s;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must stay at or above MAX_UPLOAD_BYTES (5 MiB), which the backend applies
    # to the whole request body. nginx's default is 1m, which rejected most
    # phone photos here with its own HTML 413 before the request reached the
    # API. Deliberately a margin above rather than equal: at the same value an
    # oversized upload gets nginx's error page instead of the API's JSON "Image
    # is too large". MAX_UPLOAD_BYTES is an env var while this file is baked
    # into the image, so raising that alone puts the cap back here.
    client_max_body_size 6m;

    # React Router owns the URL space, so a deep link like /listings/<id> has no
    # file behind it. Without this fallback a refresh on any route but "/" is a
    # 404 from nginx that never reaches the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mirrors the dev proxy in vite.config.ts. The browser calls same-origin
    # paths, so these two must reach the API or every request 404s as a
    # missing static file.
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
