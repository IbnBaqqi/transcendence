<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Icon sprite. Each icon is a <symbol> with its own id and viewBox.
    Reference one from a component as:

      <svg className="h-6 w-5" aria-hidden="true">
        <use href="/icons.svg#chat-icon" />
      </svg>

    aria-hidden because the icon is decorative: the accessible name comes
    from the aria-label on the button or link wrapping it.
  -->


  <!-- Header Icons -->
  <symbol id="home-icon" viewBox="0 0 24 30">
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 2 25 H 22" />
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 3.5 25 V 19 C 2 14 5 9.5 9 9 C 9.5 4.5 13.5 3 17 4.5 C 20 6 21 9.5 20.5 12.5 C 22.5 15.5 22 20 20.5 25" />
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 5.5 16 L 12 10 L 18.5 16" />
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 7.5 14.2 V 25 H 16.5 V 14.2" />
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 10.5 23 V 19.5 H 13.5 V 23" />
  </symbol>

  <symbol id="orders-icon" viewBox="0 0 24 30">
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 7.5 9.5 C 7.5 1, 16.5 1, 16.5 9.5" />
  <ellipse cx="12" cy="9.5" rx="8.5" ry="2.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 3.5 9.5 L 6 24 C 6.5 26, 17.5 26, 18 24 L 20.5 9.5" />
  </symbol>

<symbol id="following-icon" viewBox="0 0 24 30">
  <!-- Mushroom Stem -->
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 8.5 19.5 V 25.5 C 8.5 27.5, 15.5 27.5, 15.5 25.5 V 19.5" />

  <!-- Mushroom Cap - Left Curve (Overall Narrower Cap) -->
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 4.5 18.5 C 4.5 10.5, 8.5 7.5, 11 7.8" />

  <!-- Mushroom Cap - Right Curve (Overall Narrower Cap) -->
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 18.5 13.5 C 19.2 15.2, 19.5 16.8, 19.5 18.5" />

  <!-- Mushroom Cap - Bottom Rim (Narrowed Base) -->
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 19.5 18.5 Q 12 21, 4.5 18.5" />

  <!-- Extra Large Star (Original Position) -->
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 16 0.5 L 17.6 4.8 L 22.2 4.9 L 18.5 7.6 L 19.9 12.1 L 16 9.4 L 12.1 12.1 L 13.5 7.6 L 9.8 4.9 L 14.4 4.8 Z" />
</symbol>

<symbol id="search-icon" viewBox="0 0 24 30">
  <!-- Lens Glass -->
  <circle cx="10.5" cy="13" r="7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Lens Reflection Highlight -->
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 7.5 11 C 8.5 9.3, 11 9.3, 12 10" />

  <!-- Magnifying Glass Handle (Shifted 1.5 Down) -->
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="M 15.5 18 L 21 23.5" />
</symbol>

  <symbol id="add-icon" viewBox="0 0 24 30">
  <path stroke="currentColor" d="m4.04501,16.11728c0,-4.48765 3.635,-8.12265 8.12265,-8.12265c4.48765,0 8.12265,3.635 8.12265,8.12265c0,4.48765 -3.635,8.12265 -8.12265,8.12265" stroke-width="1.5" fill="none"/>
  <path stroke="currentColor" d="m8.54149,14.37671l0,10.73349m-5.36675,-5.36675l10.73349,0" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="m11.58748,7.99462c-4.52548,-2.78491 -5.10567,-3.94529 -2.78491,-5.56982c3.24906,1.62453 3.82925,2.78491 2.78491,5.56982"/>
  <path stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none" d="m12.74786,7.99462c4.52548,-3.94529 5.68586,-5.68586 3.3651,-8.00662c-2.90095,2.32076 -3.48114,4.06133 -3.3651,8.00662"/>
  </symbol>

  <symbol id="chat-icon" viewBox="0 0 24 28">
    <ellipse id="svg_1" ry="8" rx="10" cy="12.95082" cx="12" stroke-width="1.5" stroke="currentColor" fill="none"/>
    <path id="svg_2" d="m7.36928,20.47369l-1.86928,2.97712l5.28431,-2.35359" opacity="undefined" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" stroke="currentColor" fill="none"/>
  </symbol>

  <symbol id="notifications-icon" viewBox="0 0 24 26">
    <path
      id="svg_1"
      d="m18,12.22726a6,6 0 0 0 -12,0c0,7 -3,9 -3,9l18,0s-3,-2 -3,-9"
      stroke-width="1.5"
      stroke-linejoin="round"
      stroke-linecap="round"
      stroke="currentColor"
      fill="none"
    />
    <path
      id="svg_2"
      d="m13.73,25.22726a2,2 0 0 1 -3.46,0"
      stroke-width="1.5"
      stroke-linejoin="round"
      stroke-linecap="round"
      stroke="currentColor"
      fill="none"
    />
  </symbol>
</svg>
